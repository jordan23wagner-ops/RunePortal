<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0d14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>RIFTFALL</title>
<style>
/* ============================================================
   RIFTFALL — design tokens
   ============================================================ */
:root{
  --bg:#0b0d14;
  --bg2:#10131f;
  --panel:#141826;
  --panel2:#1b2032;
  --panel3:#232a40;
  --line:#2a3250;
  --line2:#39425f;
  --txt:#e6e9f2;
  --dim:#8f99b2;
  --dim2:#616c88;
  --gold:#e8b44a;
  --hp:#e0455a;
  --mp:#4a8de8;
  --xp:#5ed39a;

  --r0:#9aa4b2; /* common    */
  --r1:#4ade80; /* uncommon  */
  --r2:#38bdf8; /* rare      */
  --r3:#a78bfa; /* epic      */
  --r4:#fb923c; /* legendary */
  --r5:#f43f5e; /* unique / crafted */

  --melee:#f0955a;
  --range:#6ee7a8;
  --magic:#8ab4ff;

  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{
  margin:0;padding:0;height:100%;overflow:hidden;
  background:var(--bg);color:var(--txt);
  font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  font-size:15px;
  overscroll-behavior:none;
  touch-action:none;
  user-select:none;-webkit-user-select:none;
}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer;font-size:inherit;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px;}

#app{
  position:fixed;inset:0;display:flex;flex-direction:column;
  max-width:560px;margin:0 auto;
  background:var(--bg);
}

/* ============================================================
   ARENA
   ============================================================ */
#arenaWrap{position:relative;flex:1;min-height:0;overflow:hidden;background:#06070c;}
#arena{display:block;width:100%;height:100%;}

#zoneVignette{
  position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 0 90px 30px rgba(0,0,0,.75);
}
#hitFlash{
  position:absolute;inset:0;pointer-events:none;opacity:0;
  background:radial-gradient(ellipse at center,transparent 35%,rgba(224,69,90,.55) 100%);
  transition:opacity .12s;
}

/* --- top HUD --- */
#hud{
  position:absolute;top:0;left:0;right:0;padding:calc(6px + var(--safe-t)) 8px 8px;
  pointer-events:none;
  background:linear-gradient(180deg,rgba(6,7,12,.92) 0%,rgba(6,7,12,.55) 60%,transparent 100%);
}
.hudRow{display:flex;align-items:center;gap:8px;}
#hudZone{font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim);}
#hudKills{margin-left:auto;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;}
#hudGold{font-size:12px;color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums;}

.bar{position:relative;height:9px;border-radius:5px;background:#1a1f30;overflow:hidden;
  border:1px solid rgba(255,255,255,.07);}
.bar > i{position:absolute;inset:0;width:0%;border-radius:4px;transition:width .16s ease-out;display:block;}
.bar.sm{height:5px;}
#hpBar > i{background:linear-gradient(90deg,#8f1f2e,var(--hp));box-shadow:0 0 8px rgba(224,69,90,.5);}
#mpBar > i{background:linear-gradient(90deg,#1e4d94,var(--mp));}
#xpBar > i{background:linear-gradient(90deg,#2b7d59,var(--xp));}
.barTxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:8px;font-weight:700;letter-spacing:.4px;color:rgba(255,255,255,.85);
  text-shadow:0 1px 2px #000;font-variant-numeric:tabular-nums;}
#lvlPill{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:34px;height:20px;padding:0 6px;border-radius:5px;
  background:linear-gradient(180deg,#2a3250,#1b2032);border:1px solid var(--line2);
  font-size:11px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums;
}
#hudBars{display:flex;flex-direction:column;gap:3px;margin-top:5px;flex:1;}

/* boss banner */
#bossBar{
  position:absolute;top:calc(74px + var(--safe-t));left:14px;right:14px;
  pointer-events:none;opacity:0;transition:opacity .3s;
}
#bossBar.on{opacity:1;}
#bossName{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;
  text-align:center;color:#ff9a6b;text-shadow:0 0 12px rgba(255,80,40,.7);margin-bottom:3px;}
#bossHp{height:7px;}
#bossHp > i{background:linear-gradient(90deg,#7a1020,#ff5a3c);box-shadow:0 0 12px rgba(255,90,60,.7);}

/* --- floating combat text --- */
#fct{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.dmg{
  position:absolute;font-weight:800;font-size:14px;letter-spacing:-.3px;
  text-shadow:0 2px 3px rgba(0,0,0,.9);
  animation:dmgRise .85s ease-out forwards;white-space:nowrap;
}
.dmg.crit{font-size:21px;color:#ffd85e;text-shadow:0 0 10px rgba(255,180,0,.9),0 2px 3px #000;}
.dmg.player{color:#ff6b7d;}
.dmg.heal{color:#5ed39a;}
@keyframes dmgRise{
  0%{opacity:0;transform:translate(-50%,0) scale(.6);}
  18%{opacity:1;transform:translate(-50%,-14px) scale(1.12);}
  35%{transform:translate(-50%,-20px) scale(1);}
  100%{opacity:0;transform:translate(-50%,-52px) scale(.92);}
}

/* --- toasts --- */
/* top-anchored so they never sit on top of the thumb controls */
#toasts{
  position:absolute;left:0;right:0;top:calc(104px + var(--safe-t));display:flex;flex-direction:column;
  align-items:center;gap:4px;pointer-events:none;padding:0 10px;z-index:30;
}
.toast{
  max-width:100%;padding:5px 11px;border-radius:8px;font-size:11.5px;font-weight:600;
  background:rgba(16,19,31,.95);border:1px solid var(--line);
  box-shadow:0 6px 20px rgba(0,0,0,.6);
  animation:toastIn .28s cubic-bezier(.2,1.4,.4,1), toastOut .3s ease-in 2.1s forwards;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.9);}to{opacity:1;transform:none;}}
@keyframes toastOut{to{opacity:0;transform:translateY(-8px);}}

/* ============================================================
   TOUCH CONTROLS
   ============================================================ */
#stickZone{position:absolute;left:0;bottom:0;width:48%;height:58%;z-index:12;}
#stick{
  position:absolute;width:112px;height:112px;border-radius:50%;
  border:2px solid rgba(255,255,255,.14);background:rgba(20,24,38,.35);
  opacity:0;transition:opacity .15s;pointer-events:none;
  backdrop-filter:blur(2px);
}
#stick.on{opacity:1;}
#stickNub{
  position:absolute;width:50px;height:50px;border-radius:50%;left:31px;top:31px;
  background:radial-gradient(circle at 35% 30%,#4d5a80,#222a42);
  border:1px solid rgba(255,255,255,.22);
  box-shadow:0 3px 12px rgba(0,0,0,.55);
}

#actions{
  position:absolute;right:12px;bottom:calc(14px);z-index:14;
  display:grid;grid-template-columns:repeat(2,auto);gap:10px;align-items:end;
}
.actBtn{
  position:relative;width:60px;height:60px;border-radius:50%;
  background:linear-gradient(180deg,rgba(40,48,74,.92),rgba(22,27,43,.92));
  border:2px solid var(--line2);
  display:flex;align-items:center;justify-content:center;
  font-size:22px;box-shadow:0 4px 14px rgba(0,0,0,.5);
  overflow:hidden;
}
.actBtn.big{width:74px;height:74px;font-size:27px;}
.actBtn:active{transform:scale(.93);}
.actBtn .cd{
  position:absolute;inset:0;background:rgba(6,8,14,.72);
  transform-origin:bottom;transform:scaleY(0);pointer-events:none;
}
.actBtn .qty{
  position:absolute;bottom:2px;right:5px;font-size:10px;font-weight:800;
  color:var(--txt);text-shadow:0 1px 2px #000;
}
.actBtn.rdy{border-color:var(--gold);box-shadow:0 0 14px rgba(232,180,74,.35),0 4px 14px rgba(0,0,0,.5);}
.actBtn.off{opacity:.4;}
#btnSkill{border-color:#6f7dd6;}
#btnPot{border-color:#3f7f5c;}

/* zone exit / chest prompt */
#prompt{
  position:absolute;left:50%;transform:translateX(-50%);bottom:calc(100px);
  z-index:16;padding:9px 18px;border-radius:9px;font-size:13px;font-weight:700;
  background:linear-gradient(180deg,#2a3250,#1b2032);border:1px solid var(--gold);
  color:var(--gold);box-shadow:0 0 18px rgba(232,180,74,.3);display:none;
  animation:pulseP 1.3s ease-in-out infinite;
}
@keyframes pulseP{0%,100%{box-shadow:0 0 14px rgba(232,180,74,.25);}50%{box-shadow:0 0 26px rgba(232,180,74,.5);}}

/* ============================================================
   TAB BAR
   ============================================================ */
#tabbar{
  display:flex;background:var(--bg2);border-top:1px solid var(--line);
  padding-bottom:var(--safe-b);z-index:40;flex:0 0 auto;
}
.tab{
  flex:1;padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--dim2);
  position:relative;transition:color .15s;
}
.tab .ic{font-size:19px;line-height:1;filter:grayscale(1) opacity(.55);transition:filter .15s;}
.tab.sel{color:var(--gold);}
.tab.sel .ic{filter:none;}
.tab.sel::before{content:'';position:absolute;top:0;left:22%;right:22%;height:2px;
  background:var(--gold);border-radius:0 0 2px 2px;box-shadow:0 0 8px var(--gold);}
.tab .dot{
  position:absolute;top:5px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;
  background:var(--r4);border:1.5px solid var(--bg2);display:none;
  box-shadow:0 0 6px var(--r4);
}
.tab.alert .dot{display:block;}

/* ============================================================
   PANELS
   ============================================================ */
#panels{position:absolute;inset:0;z-index:35;pointer-events:none;}
.panel{
  position:absolute;inset:0 0 0 0;background:var(--bg);
  display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .26s cubic-bezier(.3,.9,.3,1);
  pointer-events:auto;
}
.panel.open{transform:none;}
.pHead{
  flex:0 0 auto;padding:calc(10px + var(--safe-t)) 12px 10px;
  display:flex;align-items:center;gap:10px;
  border-bottom:1px solid var(--line);background:var(--bg2);
}
.pTitle{font-size:14px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;}
.pSub{font-size:10px;color:var(--dim2);letter-spacing:.6px;margin-top:1px;}
.pClose{
  margin-left:auto;width:32px;height:32px;border-radius:8px;background:var(--panel2);
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  font-size:16px;color:var(--dim);
}
.pBody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;padding:12px;touch-action:pan-y;}
.pFoot{flex:0 0 auto;padding:10px 12px calc(10px + var(--safe-b));border-top:1px solid var(--line);
  background:var(--bg2);display:flex;gap:8px;}

.seg{display:flex;gap:6px;padding:3px;background:var(--panel);border-radius:9px;
  border:1px solid var(--line);margin-bottom:12px;}
.seg button{
  flex:1;padding:7px 4px;border-radius:6px;font-size:11px;font-weight:700;
  letter-spacing:.5px;text-transform:uppercase;color:var(--dim);transition:.15s;
}
.seg button.sel{background:var(--panel3);color:var(--txt);box-shadow:0 1px 4px rgba(0,0,0,.4);}

.btn{
  padding:10px 14px;border-radius:9px;font-size:12px;font-weight:700;letter-spacing:.6px;
  text-transform:uppercase;background:var(--panel2);border:1px solid var(--line2);color:var(--txt);
  transition:.12s;
}
.btn:active{transform:scale(.97);}
.btn.pri{background:linear-gradient(180deg,#c99534,#9a6f1e);border-color:#e8b44a;color:#1a1408;
  box-shadow:0 2px 10px rgba(232,180,74,.25);}
.btn.dan{background:linear-gradient(180deg,#8f2534,#6a1824);border-color:#c04256;color:#ffe6ea;}
.btn.gho{background:transparent;}
.btn:disabled{opacity:.38;}
.btn.wide{flex:1;}
.btn.sm{padding:7px 10px;font-size:10px;}

.empty{text-align:center;color:var(--dim2);font-size:12px;padding:34px 16px;line-height:1.7;}
.sectionLbl{font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--dim2);margin:14px 0 7px;display:flex;align-items:center;gap:8px;}
.sectionLbl::after{content:'';flex:1;height:1px;background:var(--line);}
.sectionLbl:first-child{margin-top:0;}

/* ============================================================
   ITEM CARDS — the heart of the card-game look
   ============================================================ */
.rar0{--rc:var(--r0);} .rar1{--rc:var(--r1);} .rar2{--rc:var(--r2);}
.rar3{--rc:var(--r3);} .rar4{--rc:var(--r4);} .rar5{--rc:var(--r5);}

.card{
  position:relative;display:flex;gap:10px;align-items:center;
  padding:9px 10px;border-radius:10px;margin-bottom:7px;
  background:linear-gradient(135deg,var(--panel2) 0%,var(--panel) 62%);
  border:1px solid var(--line);
  border-left:3px solid var(--rc,var(--r0));
  overflow:hidden;transition:.13s;
}
.card::after{
  content:'';position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;
  background:var(--rc,var(--r0));opacity:.07;pointer-events:none;
}
.card:active{transform:scale(.985);background:var(--panel2);}
.card.sel{border-color:var(--rc);box-shadow:0 0 0 1px var(--rc),0 0 16px -4px var(--rc);}
.card.eq{border-left-width:3px;}
.card.glow3{box-shadow:0 0 16px -6px var(--r3);}
.card.glow4{box-shadow:0 0 20px -5px var(--r4);animation:legPulse 2.6s ease-in-out infinite;}
.card.glow5{box-shadow:0 0 22px -5px var(--r5);animation:legPulse 2.2s ease-in-out infinite;}
@keyframes legPulse{0%,100%{box-shadow:0 0 14px -7px var(--rc);}50%{box-shadow:0 0 26px -4px var(--rc);}}

.cIcon{
  flex:0 0 auto;width:42px;height:42px;border-radius:9px;display:flex;
  align-items:center;justify-content:center;font-size:23px;
  background:radial-gradient(circle at 40% 30%,rgba(255,255,255,.07),rgba(0,0,0,.35));
  border:1px solid var(--rc,var(--r0));
  box-shadow:inset 0 0 14px -4px var(--rc,var(--r0));
}
.cMid{flex:1;min-width:0;}
.cName{font-size:12.5px;font-weight:800;color:var(--rc,var(--r0));
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.2px;}
.cMeta{font-size:10px;color:var(--dim2);margin-top:2px;letter-spacing:.3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cStat{font-size:11px;color:var(--dim);margin-top:3px;font-variant-numeric:tabular-nums;}
.cStat b{color:var(--txt);font-weight:700;}
.cRight{flex:0 0 auto;text-align:right;display:flex;flex-direction:column;
  align-items:flex-end;gap:3px;}
.ilvl{font-size:9px;font-weight:800;letter-spacing:.6px;color:var(--dim2);}
.plus{font-size:11px;font-weight:800;color:var(--xp);}
.rollBar{width:46px;height:3px;border-radius:2px;background:#1a1f30;overflow:hidden;}
.rollBar > i{display:block;height:100%;background:linear-gradient(90deg,#4a5670,var(--rc));}
.tagEq{font-size:8px;font-weight:800;letter-spacing:1px;padding:2px 5px;border-radius:4px;
  background:rgba(94,211,154,.15);color:var(--xp);border:1px solid rgba(94,211,154,.35);}
.tagNew{font-size:8px;font-weight:800;letter-spacing:1px;padding:2px 5px;border-radius:4px;
  background:rgba(232,180,74,.16);color:var(--gold);border:1px solid rgba(232,180,74,.4);}
.affList{margin-top:4px;display:flex;flex-wrap:wrap;gap:3px 7px;}
.aff{font-size:10px;color:#9ec4ff;font-variant-numeric:tabular-nums;}
.aff.uni{color:var(--r5);font-weight:700;}

/* ============================================================
   INVENTORY GRID — ARPG item frames, not a card list
   ============================================================ */
#bagGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:7px;}
.gcell{
  position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;
  background:linear-gradient(160deg,var(--panel2) 0%,var(--panel) 72%);
  border:1px solid var(--line);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.02);
  display:flex;align-items:center;justify-content:center;
  font-size:27px;line-height:1;transition:transform .1s;
}
.gcell::before{
  content:'';position:absolute;inset:0;border-radius:9px;
  border:1.5px solid var(--rc);opacity:.85;pointer-events:none;
}
.gcell::after{
  content:'';position:absolute;left:-40%;bottom:-60%;width:180%;height:120%;
  background:radial-gradient(ellipse at center,var(--rc) 0%,transparent 68%);
  opacity:.16;pointer-events:none;
}
.gcell:active{transform:scale(.94);}
.gcell.g3{box-shadow:0 0 14px -5px var(--r3),inset 0 0 12px -6px var(--r3);}
.gcell.g4{box-shadow:0 0 18px -4px var(--r4),inset 0 0 14px -6px var(--r4);}
.gcell.g5{box-shadow:0 0 20px -4px var(--r5),inset 0 0 14px -5px var(--r5);}
.gcell .gp{
  position:absolute;bottom:2px;right:4px;font-size:9.5px;font-weight:900;
  color:var(--xp);text-shadow:0 1px 2px #000;
}
.gcell .gl{
  position:absolute;bottom:2px;left:4px;font-size:8px;font-weight:800;
  color:var(--dim2);text-shadow:0 1px 2px #000;font-variant-numeric:tabular-nums;
}
.gcell .gn{
  position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;
  background:var(--gold);box-shadow:0 0 6px var(--gold);
}
.gcell .ge{
  position:absolute;top:2px;left:3px;font-size:9px;color:var(--xp);
  text-shadow:0 1px 2px #000;
}
.gcell.slotEmpty{
  background:rgba(255,255,255,.015);border-style:dashed;border-color:var(--line);
}
.gcell.slotEmpty::before,.gcell.slotEmpty::after{display:none;}

/* ============================================================
   EQUIPMENT DOLL
   ============================================================ */
.slotGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;}
.slot{
  position:relative;display:flex;gap:8px;align-items:center;padding:8px;
  border-radius:9px;background:var(--panel);border:1px solid var(--line);
  border-left:3px solid var(--rc,#2a3250);min-height:56px;transition:.13s;
}
.slot.filled::after{content:'';position:absolute;right:-24px;top:-24px;width:70px;height:70px;
  border-radius:50%;background:var(--rc);opacity:.07;}
.slot:active{transform:scale(.98);}
.slotIc{flex:0 0 auto;width:34px;height:34px;border-radius:8px;display:flex;
  align-items:center;justify-content:center;font-size:18px;
  background:rgba(0,0,0,.28);border:1px solid var(--rc,var(--line));}
.slot.empty .slotIc{opacity:.3;border-style:dashed;}
.slotTxt{flex:1;min-width:0;}
.slotLbl{font-size:8.5px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim2);}
.slotName{font-size:11px;font-weight:700;color:var(--rc,var(--dim2));margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.slot.empty .slotName{color:var(--dim2);font-weight:500;font-style:italic;}
.slot.wide{grid-column:1 / -1;}

/* stat sheet */
.statGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;}
.statRow{display:flex;align-items:center;gap:6px;padding:7px 9px;border-radius:8px;
  background:var(--panel);border:1px solid var(--line);}
.statRow .k{font-size:10px;color:var(--dim);letter-spacing:.4px;flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.statRow .v{font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;}
.statRow .v.up{color:var(--xp);}
.coreStat{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:9px;
  background:var(--panel);border:1px solid var(--line);margin-bottom:6px;}
.coreStat .sIc{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;
  justify-content:center;font-size:14px;font-weight:900;background:var(--panel3);}
.coreStat .sName{flex:1;}
.coreStat .sName b{display:block;font-size:12px;font-weight:800;letter-spacing:.6px;}
.coreStat .sName span{font-size:9.5px;color:var(--dim2);}
.coreStat .sVal{font-size:16px;font-weight:900;font-variant-numeric:tabular-nums;min-width:30px;
  text-align:right;}
.coreStat .sVal em{font-style:normal;font-size:11px;color:var(--xp);}
.addBtn{width:28px;height:28px;border-radius:7px;background:var(--panel3);

#modalWrap{

.detName{font-size:16px;font-weight:900;color:var(--rc);letter-spacing:.3px;line-height:1.2;}

#lootWrap{
  position:absolute;inset:0;z-index:70;display:none;align-items:center;justify-content:center;

}
.lootCard::before{

}
@keyframes shine{from{transform:translateX(-60%);}to{transform:translateX(60%);}}

/* death */

}

/* intro */
#intro{

}

}

.classOpt .cDs{font-size:8.5px;color:var(--dim2);line-height:1.35;}
#introDesc{font-size:11px;color:var(--dim);line-height:1.6;margin:16px 0 4px;min-height:34px;max-width:320px;}

/* misc */
.kv{display:flex;justify-content:space-between;font-size:11px;padding:4px 0;color:var(--dim);}
.kv b{color:var(--txt);font-variant-numeric:tabular-nums;}
.warn{font-size:10.5px;color:#ffb27a;background:rgba(251,146,60,.09);border:1px solid rgba(251,146,60,.28);
  border-radius:8px;padding:8px 10px;line-height:1.5;margin-bottom:10px;}

@media (max-height:640px){

  #stick{width:96px;height:96px;} #stickNub{width:44px;height:44px;left:26px;top:26px;}
}
</style>

<script>
"use strict";
/* ================================================================
   RIFTFALL — zone looter
   Standalone. Save key: riftfall_save   (never touches runeportal_save)
   ================================================================ */

const SAVE_KEY = 'riftfall_save';
const SAVE_VER = 1;

/* ---------- utility ---------- */
const rnd  = (a,b)=> a + Math.random()*(b-a);
const rint = (a,b)=> Math.floor(a + Math.random()*(b-a+1));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const clamp= (v,a,b)=> v<a?a:(v>b?b:v);
const lerp = (a,b,t)=> a+(b-a)*t;
const fmt  = n => n>=1e6 ? (n/1e6).toFixed(1)+'M' : n>=1e4 ? (n/1e3).toFixed(1)+'k' : Math.round(n).toString();
const $    = id => document.getElementById(id);
function wpick(list){ // [{w:..},...]
  let t=0; for(const o of list) t+=o.w;
  let r=Math.random()*t;
  for(const o of list){ r-=o.w; if(r<=0) return o; }
  return list[list.length-1];
}

/* ================================================================
   RARITY
   ================================================================ */
const RARITY = [
  {id:0,name:'Common',   col:'#9aa4b2',aff:0,mult:1.00,sal:1 },
  {id:1,name:'Uncommon', col:'#4ade80',aff:1,mult:1.12,sal:2 },
  {id:2,name:'Rare',     col:'#38bdf8',aff:2,mult:1.30,sal:4 },
  {id:3,name:'Epic',     col:'#a78bfa',aff:3,mult:1.55,sal:7 },
  {id:4,name:'Legendary',col:'#fb923c',aff:4,mult:1.90,sal:12},
  {id:5,name:'Relic',    col:'#f43f5e',aff:0,mult:2.25,sal:20}, // crafted only
];

/* base drop weights, shifted up by zone tier + enemy rank + luck */
const RARITY_BASE = [620,270,86,20,4];

/* ================================================================
   CORE STATS
   ================================================================ */
const STATS = [
  {k:'str',n:'Strength', d:'Melee damage',       ic:'S',col:'#f0955a'},
  {k:'dex',n:'Dexterity',d:'Ranged dmg · crit',  ic:'D',col:'#6ee7a8'},
  {k:'int',n:'Intellect',d:'Magic dmg · mana',   ic:'I',col:'#8ab4ff'},
  {k:'vit',n:'Vitality', d:'Health · regen',     ic:'V',col:'#e0455a'},
];

/* ================================================================
   WEAPON ARCHETYPES
   dmg  = damage multiplier vs baseline
   spd  = attacks per second
   pat  = attack pattern handled in combat
   ================================================================ */
const WEAPONS = {
  /* ---- MELEE (STR) ---- */

  armBase:  (il)=> 4 + il*2.1,          // armor value baseline

   divisors renormalise each tier back onto a shared curve — later zones stay

   level scaling does the real work. Index = zone tier - 1. */

/* ================================================================
   ITEM GENERATION
   ================================================================ */
function rollRarity(tier, rank, luck){
  const w = RARITY_BASE.slice();
  /* zone tier pushes weight upward */
  const shift = (tier-1)*0.55 + (rank||0)*1.25 + (luck||0)/55;
  for(let i=1;i<5;i++) w[i] *= (1 + shift*(i*0.62));
  w[0] = Math.max(40, w[0] - shift*130);
  let t=0; for(const x of w) t+=x;
  let r=Math.random()*t;
  for(let i=0;i<5;i++){ r-=w[i]; if(r<=0) return i; }
  return 0;
}

/* min/max damage band with a quality roll inside it */
function rollDamage(arch, ilvl, rar){
  const A = WEAPONS[arch];
  const avg  = TUNE.wpnBase(ilvl) * A.dmg * RARITY[rar].mult;
  const lo   = avg*0.62, hi = avg*1.38;
  /* the item rolls a window somewhere inside [lo,hi] */
  const q1 = Math.random(), q2 = Math.random();
  const qMin = Math.min(q1,q2), qMax = Math.max(q1,q2);
  let dmin = Math.round(lerp(lo, avg*0.98, qMin));
  let dmax = Math.round(lerp(avg*1.02, hi, qMax));
  if(dmax<=dmin) dmax = dmin+1;
  const mid = (dmin+dmax)/2;
  const quality = clamp((mid-lo)/(hi-lo),0,1);
  return {dmin,dmax,quality};
}

function rollAffix(ilvl, rar, forceKey){
  const a = forceKey ? AFFIX_MAP[forceKey] : wpick(AFFIXES.map(x=>({w:x.w,...x})));
  const roll = Math.random();
  let v = lerp(a.lo, a.hi, roll) + a.per*ilvl*lerp(0.55,1,roll);
  v *= (1 + rar*0.055);
  v = a.fl ? Math.round(v*10)/10 : Math.max(1,Math.round(v));
  return {k:a.k, v, roll:Math.round(roll*100)/100};
}

/* At most three parts: [prefix OR tier] + noun + [of Suffix].
   Rarer items trade the material word for a prefix rather than stacking both. */
function nameItem(base, rar, affixes, tierName){
  let n = (rar>=2 ? pick(PREFIXES) : tierName) + ' ' + base;
  if(rar>=1 && affixes.length){
    const top = affixes.slice().sort((a,b)=>b.roll-a.roll)[0];
    n += ' '+AFFIX_MAP[top.k].suf;
  }
  return n;
}

/**
 * rollItem({kind,slot,ilvl,rar,line,forceArch})
 * kind: weapon | armor | trinket | offhand
 */
function rollItem(o){
  const ilvl = Math.max(1, Math.round(o.ilvl||1));
  const rar  = o.rar==null ? rollRarity(1,0,0) : o.rar;
  const R    = RARITY[rar];
  const it   = {uid:uidSeq++, ilvl, rar, plus:0, affixes:[], new:1};

  if(o.kind==='weapon'){
    const keys = Object.keys(WEAPONS);
    const arch = o.forceArch || pick(keys);
    const A = WEAPONS[arch];
    const d = rollDamage(arch, ilvl, rar);
    Object.assign(it,{kind:'weapon',slot:'weapon',arch,ic:A.ic,
      dmin:d.dmin,dmax:d.dmax,quality:d.quality,base:A.n,cls:A.cls});
  } else if(o.kind==='offhand'){
    const keys = Object.keys(OFFHANDS);
    const arch = o.forceArch || pick(keys);
    const O = OFFHANDS[arch];
    Object.assign(it,{kind:'offhand',slot:'offhand',arch,ic:O.ic,base:O.n,
      armor:Math.round(TUNE.armBase(ilvl)*O.armor*R.mult)});
  } else if(o.kind==='trinket'){
    const t = o.slot==='amulet'||o.slot==='ring' ? o.slot : pick(['amulet','ring']);
    Object.assign(it,{kind:'trinket',slot:t,arch:t,ic:TRINKETS[t].ic,base:TRINKETS[t].n,armor:0});
  } else {
    const slot = o.slot || pick(Object.keys(ARMOR_SLOTS));
    const line = o.line || pick(Object.keys(ARMOR_LINES));
    const L = ARMOR_LINES[line], SL = ARMOR_SLOTS[slot];
    Object.assign(it,{kind:'armor',slot,arch:line,ic:L.ic[slot],
      base:L.noun[slot], line,
      armor:Math.round(TUNE.armBase(ilvl)*L.armor*SL.mult*R.mult)});
    /* armor lines lean into a stat */
    if(rar>0) it.affixes.push(rollAffix(ilvl,rar,L.lean));
  }

  /* trinkets get one bonus affix — that's their identity */
  const want = R.aff + (it.kind==='trinket'?1:0);
  const used = new Set(it.affixes.map(a=>a.k));
  let guard=0;
  while(it.affixes.length<want && guard++<40){
    const a = rollAffix(ilvl,rar);
    if(used.has(a.k)) continue;
    used.add(a.k); it.affixes.push(a);
  }
  const tierName = TIER_NAME[clamp(Math.floor((ilvl-1)/11),0,4)];
  it.name = nameItem(it.base, rar, it.affixes, tierName);
  return it;
}

/* build a crafted relic instance */
function makeRelic(def){
  const it = {uid:uidSeq++, ilvl:def.ilvl, rar:5, plus:0, kind:'', slot:def.slot,
    ic:def.ic, name:def.n, base:def.n, affixes:[], relic:def.id,
    uniq:def.uniq, flavor:def.flavor, new:1};
  if(def.slot==='weapon'){
    const A = WEAPONS[def.wpn];
    const d = rollDamage(def.wpn, def.ilvl, 5);
    Object.assign(it,{kind:'weapon',arch:def.wpn,cls:A.cls,dmin:d.dmin,dmax:d.dmax,quality:d.quality});
  } else if(def.slot==='offhand'){
    const O = OFFHANDS[def.off];
    Object.assign(it,{kind:'offhand',arch:def.off,armor:Math.round(TUNE.armBase(def.ilvl)*O.armor*2.25)});
  } else {
    Object.assign(it,{kind:'trinket',arch:def.slot,armor:0});
  }
  for(const k in def.affix) it.affixes.push({k, v:def.affix[k], roll:1});
  return it;
}

/* ================================================================
   DERIVED STATS
   ================================================================ */
let D = {};   // derived stat cache
function equippedList(){
  const out=[]; for(const k of SLOT_ORDER){ const i=S.equip[k]; if(i) out.push(i); } return out;
}
function computeStats(){
  const d = {str:S.base.str,dex:S.base.dex,int:S.base.int,vit:S.base.vit,
    armor:0,maxHp:0,critC:5,critD:150,atkSpd:0,movSpd:0,allDmg:0,
    lifeHit:0,hpReg:1,mpReg:1.2,goldF:0,luck:0,thorns:0};
  const uniq = {};
  for(const it of equippedList()){
    if(it.armor) d.armor += Math.round(it.armor*(1+it.plus*0.06));
    for(const a of it.affixes){ if(d[a.k]!=null) d[a.k]+=a.v; }
    if(it.uniq) uniq[it.uniq.k]=it.uniq;
  }
  /* level scaling */
  d.maxHp += 60 + d.vit*11 + S.lvl*6;
  d.maxMp  = 34 + d.int*7 + S.lvl*3;
  d.critC += d.dex*0.16;
  d.armor += Math.round(d.str*0.6);
  d.hpReg += d.vit*0.09;
  d.mpReg += d.int*0.06;

  const w = S.equip.weapon;
  const A = w ? WEAPONS[w.arch] : null;
  d.wpnCls  = A?A.cls:'melee';
  d.mainStat= A?d[A.stat]:d.str;
  if(A){
    if(A.crit) d.critC += A.crit;
    d.atkTime = 1/(A.spd*(1+d.atkSpd/100));
    d.range   = A.rng;
    d.mpCost  = A.mp||0;
  } else { d.atkTime = 1/(1.2*(1+d.atkSpd/100)); d.range=58; d.mpCost=0; }

  /* offhand class bonuses */
  const off = S.equip.offhand;
  if(off && OFFHANDS[off.arch]){
    const O = OFFHANDS[off.arch];
    if(O.critC) d.critC += O.critC;
    if(O.rangeDmg && d.wpnCls==='range') d.allDmg += O.rangeDmg*100;
    if(O.magicDmg && d.wpnCls==='magic') d.allDmg += O.magicDmg*100;
    if(off.arch==='shield') d.block = 0.14;
  }
  d.critC = clamp(d.critC,0,75);
  d.moveSpeed = 168*(1+d.movSpd/100);
  d.uniq = uniq;

  /* damage per swing range, shown in UI */
  const mult = (1+d.mainStat*TUNE.statDmg)*(1+d.allDmg/100);
  const pb   = 1 + (w?w.plus*0.06:0);
  d.hitMin = w? Math.round(w.dmin*pb*mult) : Math.round(3*mult);
  d.hitMax = w? Math.round(w.dmax*pb*mult) : Math.round(5*mult);
  d.dps    = Math.round(((d.hitMin+d.hitMax)/2)*(1/d.atkTime)*(1+(d.critC/100)*((d.critD-100)/100)));
  D = d; return d;
}
function mitigate(raw, eLvl){
  const red = D.armor/(D.armor + 46 + 13*eLvl);
  let dmg = raw*(1-clamp(red,0,0.76));
  if(D.block && Math.random()<D.block) dmg*=0.45;
  if(P && P.bulwark) dmg *= (1 - Math.min(0.36, P.bulwark*0.12));
  return dmg;
}

/* ================================================================
   PROGRESSION
   ================================================================ */
function gainXp(n){
  S.xp += n;
  let leveled = 0;
  while(S.xp >= TUNE.xpNeed(S.lvl)){
    S.xp -= TUNE.xpNeed(S.lvl);
    S.lvl++; S.pts += TUNE.ptsPerLvl; leveled++;
  }
  if(leveled){
    computeStats();
    P.hp = D.maxHp; P.mp = D.maxMp;
    showLevelUp(leveled);
    sfx('level');
  }
}
function gainGold(n){ S.gold += Math.max(0,Math.round(n)); }
function addMat(k,n){ S.mats[k]=(S.mats[k]||0)+n; }
function hasMats(cost){
  for(const k in cost){
    if(k==='gold'){ if(S.gold<cost[k]) return false; }
    else if((S.mats[k]||0) < cost[k]) return false;
  }
  return true;
}
function payMats(cost){
  for(const k in cost){
    if(k==='gold') S.gold-=cost[k]; else S.mats[k]=(S.mats[k]||0)-cost[k];
  }
}
function bagAdd(it){
  if(S.bag.length>=TUNE.bagMax) return false;
  S.bag.push(it); S.meta.items++;
  if(it.rar>S.meta.best) S.meta.best=it.rar;
  return true;
}
function salvageYield(it){
  const R = RARITY[it.rar];
  const y = {gold: Math.round(6 + it.ilvl*2.2*(1+it.rar*0.5))};
  if(it.rar<=1){ y.scrap = R.sal + Math.floor(it.ilvl/9); }
  else if(it.rar===2){ y.scrap=3; y.dust = 1+Math.floor(it.ilvl/14); }
  else if(it.rar===3){ y.dust=3; y.core = 1+Math.floor(it.ilvl/22); }
  else { y.core=3; y.sigil = 1; }
  if(it.plus>0) y.gold += it.plus*40;
  return y;
}
function salvage(it){
  const y = salvageYield(it);
  for(const k in y){ if(k==='gold') gainGold(y.gold); else addMat(k,y[k]); }
  S.meta.salvaged++;
  return y;
}
function upgradeCost(it){
  const p = it.plus;
  const c = {gold: Math.round(120*Math.pow(1.55,p) + it.ilvl*26)};
  const tier = clamp(Math.floor((it.ilvl-1)/11),0,4);
  const zoneMat = ZONES[tier].mats[0];
  c.scrap = 4 + p*3;
  c[zoneMat] = (c[zoneMat]||0) + 2 + p*2;
  if(p>=4) c.dust = (p-3)*3;
  if(p>=7) c.core = (p-6)*2;
  return c;
}

/* ================================================================
   AUDIO — pure WebAudio synthesis, zero asset files
   ================================================================ */
let AC=null, masterGain=null;
function audioInit(){
  if(AC) return;
  try{
    AC = new (window.AudioContext||window.webkitAudioContext)();
    masterGain = AC.createGain(); masterGain.gain.value = 0.32;
    masterGain.connect(AC.destination);
  }catch(e){ AC=null; }
}
function tone(freq, dur, type, vol, slideTo, delay){
  if(!AC || !S || !S.opts.sfx) return;
  const t0 = AC.currentTime + (delay||0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type||'sine';
  o.frequency.setValueAtTime(freq, t0);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo), t0+dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002,vol||0.2), t0+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(g); g.connect(masterGain);
  o.start(t0); o.stop(t0+dur+0.02);
}
function noise(dur, vol, hp){
  if(!AC || !S || !S.opts.sfx) return;
  const n = Math.floor(AC.sampleRate*dur);
  const buf = AC.createBuffer(1,n,AC.sampleRate);
  const ch = buf.getChannelData(0);
  for(let i=0;i<n;i++) ch[i] = (Math.random()*2-1)*Math.pow(1-i/n,2.2);
  const src = AC.createBufferSource(); src.buffer = buf;
  const f = AC.createBiquadFilter(); f.type = hp?'highpass':'lowpass';
  f.frequency.value = hp||1400;
  const g = AC.createGain(); g.gain.value = vol||0.18;
  src.connect(f); f.connect(g); g.connect(masterGain); src.start();
}
const SFX = {
  hit:   ()=>{ tone(rnd(180,240),0.07,'square',0.11,90); noise(0.05,0.07,900); },
  crit:  ()=>{ tone(340,0.13,'sawtooth',0.17,120); noise(0.09,0.13,600); tone(720,0.09,'square',0.09,400,0.02); },
  shoot: ()=>{ tone(620,0.07,'triangle',0.08,300); },
  cast:  ()=>{ tone(440,0.14,'sine',0.10,880); },
  kill:  ()=>{ noise(0.16,0.13,420); tone(150,0.16,'sawtooth',0.10,55); },
  hurt:  ()=>{ tone(190,0.20,'sawtooth',0.16,70); noise(0.12,0.12,500); },

   CANVAS
   ================================================================ */
const cv = $('arena'), ctx = cv.getContext('2d');
let W=360,H=560,DPR=1;
/* Rig rendering is fill-rate bound: measured on a saturated arena, DPR 2 runs
   ~48fps while DPR 1.5 holds a locked 60 with every effect on. The DOM UI is
   unaffected (it is not canvas) and the soft-shaded art hides the difference.
   Sustained slow frames step down further; it never steps back up past the
   tier the player chose. */
const GFX_TIERS = {
  high:{dpr:1.50, shadow:1, glow:1, detail:1},
  med :{dpr:1.25, shadow:1, glow:1, detail:1},
  low :{dpr:1.00, shadow:0, glow:1, detail:0},
};
let gfxTier='high', dprCap=1.50;
function applyGfx(tier){
  gfxTier = GFX_TIERS[tier] ? tier : 'high';
  const t = GFX_TIERS[gfxTier];
  dprCap = t.dpr;
  GFX.shadow=t.shadow; GFX.glow=t.glow; GFX.detail=t.detail;
  GFX.parts=1; GFX.backdrop=1; GFX.weapon=1;
  resizeCanvas();
}
function resizeCanvas(){
  const r = $('arenaWrap').getBoundingClientRect();
  DPR = Math.min(dprCap, window.devicePixelRatio||1);
  W = Math.max(200, r.width); H = Math.max(240, r.height);
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  cv.style.width = W+'px'; cv.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  buildBackdrop();
}
window.addEventListener('resize', ()=>{ resizeCanvas(); });

/* cached glow sprites (cheap radial glow without per-frame gradients) */
const glowCache = {}; let glowKeys = [];
function glowSprite(col, size){
  const key = col+'_'+size;
  if(glowCache[key]) return glowCache[key];
  /* bounded: a runaway key set would allocate a canvas every frame */
  if(glowKeys.length > 80){ delete glowCache[glowKeys.shift()]; }
  glowKeys.push(key);
  const c = document.createElement('canvas');
  c.width = c.height = size*2;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(size,size,0,size,size,size);
  grd.addColorStop(0, col); grd.addColorStop(0.35, col+'88');
  grd.addColorStop(1, col+'00');
  g.fillStyle = grd; g.fillRect(0,0,size*2,size*2);
  glowCache[key] = c; return c;
}
function drawGlow(x,y,col,size,alpha){
  if(typeof GFX!=='undefined' && !GFX.glow) return;
  size = Math.max(4, Math.round(size));   /* quantise: keeps the cache bounded */
  const s = glowSprite(col, size);
  ctx.globalAlpha = alpha==null?0.55:alpha;
  ctx.drawImage(s, x-size, y-size);
  ctx.globalAlpha = 1;
}

/* parallax backdrop, rebuilt on zone change/resize */
let backdrop=null, bdMotes=[];
function buildBackdrop(){
  const z = ZONE_BY_ID[S?S.zone:'verdant'];
  backdrop = document.createElement('canvas');
  backdrop.width = Math.round(W); backdrop.height = Math.round(H);
  const g = backdrop.getContext('2d');
  const grd = g.createLinearGradient(0,0,0,H);
  grd.addColorStop(0, z.sky); grd.addColorStop(0.55, z.sky2); grd.addColorStop(1, z.ground);
  g.fillStyle = grd; g.fillRect(0,0,W,H);
  /* ground texture blobs */
  for(let i=0;i<70;i++){
    const x=Math.random()*W, y=Math.random()*H, r=rnd(14,70);
    g.globalAlpha = rnd(0.02,0.07);
    g.fillStyle = i%3===0 ? z.accent : '#ffffff';
    g.beginPath(); g.ellipse(x,y,r,r*rnd(0.35,0.7),rnd(0,3.14),0,6.283); g.fill();
  }
  g.globalAlpha=1;
  /* rift cracks */
  g.strokeStyle = z.accent; g.globalAlpha=0.10; g.lineWidth=1.4;
  for(let i=0;i<7;i++){
    g.beginPath(); let x=Math.random()*W, y=Math.random()*H; g.moveTo(x,y);
    for(let j=0;j<5;j++){ x+=rnd(-46,46); y+=rnd(-46,46); g.lineTo(x,y); }
    g.stroke();
  }
  g.globalAlpha=1;
  bdMotes = [];
  for(let i=0;i<26;i++) bdMotes.push({x:Math.random()*W,y:Math.random()*H,
    r:rnd(0.7,2.2),s:rnd(5,22),a:rnd(0.12,0.4)});
}

function makePlayer(){
  computeStats();
  P = {x:W/2,y:H*0.62,r:16,hp:Math.min(S.hp||D.maxHp,D.maxHp),mp:Math.min(S.mp||D.maxMp,D.maxMp),
    fx:0,fy:-1,atkCd:0,dashCd:0,skillCd:0,potCd:0,inv:0,dashT:0,dvx:0,dvy:0,

/* Enemies tear in through the rift rather than walking from off-screen —
   keeps the arena dense on a phone-sized viewport. Always >=MIN_SPAWN_D away. */
const MIN_SPAWN_D = 150, MAX_SPAWN_D = 290;
function spawnPoint(){
  const px = P?P.x:W/2, py = P?P.y:H*0.62;
  for(let i=0;i<14;i++){
    const a = rnd(0,6.283), d = rnd(MIN_SPAWN_D,MAX_SPAWN_D);
    const x = px+Math.cos(a)*d, y = py+Math.sin(a)*d;
    if(x>24 && x<W-24 && y>70 && y<H-24) return {x,y};
  }
  /* fallback: push to the far side of the arena */
  return {x: px<W/2 ? W-40 : 40, y: clamp(py + (py<H/2?190:-190), 74, H-30)};
}
function makeFoe(def, rank){
  const z = ZONE_BY_ID[S.zone], L = zoneLvl();
  const hpN = TIER_HP_NORM[z.tier-1], dmgN = TIER_DMG_NORM[z.tier-1];
  let hp = TUNE.eHp(L)*(def.hp/hpN)*(1+(z.tier-1)*0.12);
  if(rank===1) hp *= TUNE.eliteHp;
  if(rank===2) hp *= TUNE.bossHp;
  const p = spawnPoint();
  const f = {
    def, rank:rank||0, x:p.x, y:p.y, r:def.size, hp, max:hp,
    dmg: TUNE.eDmg(L)*(def.dmg/dmgN), spd: 42 + def.spd*30, lvl:L,
    icd:0, st:0, t:rnd(0,3), vx:0,vy:0, flash:0, born:0,
    burn:0,burnD:0,pois:0,poisD:0,slow:0,slowA:0,stun:0,
    ang:rnd(0,6.28), pat:0, patT:0, tele:0,
    an:newAnim(), px:0, py:0,
  };
  /* keep the boss clear of the HUD + boss bar at the top of the arena */
  if(def.ai==='boss'){ f.x=W/2; f.y=Math.max(H*0.30, 126+def.size); f.spd=24+def.spd*22; f.warp=1.1; }
  return f;
}
function spawnWave(){

/* particles */
function burst(x,y,col,n,spd,life,size){
  const cap = 260;
  for(let i=0;i<n && parts.length<cap;i++){
    const a = rnd(0,6.283), s = rnd(spd*0.3,spd);
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
      life:life||0.5,max:life||0.5,col,r:size||rnd(1.5,3.4)});

}
function ring(x,y,col,r0,r1,life){ fx.push({x,y,col,r:r0,r1,t:0,life:life||0.35}); }

/* floating combat text */
const fctEl = $('fct'); let fctCount=0;
function fct(x,y,txt,cls){
  if(fctCount>26) return;
  const e = document.createElement('div');
  e.className = 'dmg'+(cls?' '+cls:'');
  e.textContent = txt; e.style.left = x+'px'; e.style.top = y+'px';
  fctEl.appendChild(e); fctCount++;
  setTimeout(()=>{ e.remove(); fctCount--; }, 880);
}
/* Capped at 3 and de-duplicated — boss "calls for aid" spam used to bury the
   whole arena (and the action buttons) under a stack of identical toasts. */
let lastToastMsg='', lastToastEl=null, lastToastN=0;
function toast(msg){
  const box = $('toasts');
  if(msg===lastToastMsg && lastToastEl && lastToastEl.isConnected){
    lastToastN++; lastToastEl.textContent = msg+' ×'+(lastToastN+1); return;
  }
  while(box.children.length>=3) box.firstChild.remove();
  const t = document.createElement('div');
  t.className='toast'; t.textContent = msg;
  box.appendChild(t);
  lastToastMsg=msg; lastToastEl=t; lastToastN=0;
  setTimeout(()=>{ t.remove(); if(lastToastEl===t){ lastToastMsg=''; lastToastEl=null; } }, 2450);
}

/* ================================================================
   COMBAT MATH
   ================================================================ */
function rollHit(mult){
  const base = rnd(D.hitMin, D.hitMax) * (mult||1);
  const crit = Math.random()*100 < D.critC;
  return {dmg: crit ? base*(D.critD/100) : base, crit};
}
function damageFoe(f, dmg, crit, opts){
  opts = opts||{};
  f.hp -= dmg; f.flash = 0.12; f.an.hurt = 1;
  if(!opts.silent){
    fct(f.x, f.y-f.r-6, Math.round(dmg).toString(), crit?'crit':'');
    if(crit){ sfx('crit'); shake=Math.max(shake,5); } else sfx('hit');
  }
  burst(f.x,f.y,crit?'#ffd85e':'#ffffff',crit?9:4,crit?190:120,0.3,crit?3:2);

  const U = D.uniq||{};
  if(!opts.noProc){
    /* --- relic procs --- */
    if(U.chill){ f.slow = 2.0; f.slowA = 0.30; }
    if(U.burn && crit){ f.burn = 3.0; f.burnD = Math.max(f.burnD, (D.hitMin+D.hitMax)/2*0.40/3); }
    if(U.poison){ f.pois = 4.0; f.poisD = Math.max(f.poisD, (D.hitMin+D.hitMax)/2*0.25/4); }
    if(U.rifttear){
      P.chainHit++;
      if(P.chainHit>=5){
        P.chainHit=0;
        const bd = (D.hitMin+D.hitMax)/2*1.8;
        f.hp -= bd; ring(f.x,f.y,'#f43f5e',6,70,0.3);
        fct(f.x,f.y-f.r-20, Math.round(bd)+'!', 'crit');
        sfx('crit'); shake=Math.max(shake,7);
      }
    }
    if(D.lifeHit>0) healPlayer(D.lifeHit, true);
  }
  if(f.hp<=0) killFoe(f);
}
function healPlayer(n, silent){
  const before = P.hp;
  P.hp = Math.min(D.maxHp, P.hp+n);
  const got = P.hp-before;
  if(!silent && got>0) fct(P.x,P.y-24,'+'+Math.round(got),'heal');
}
function hurtPlayer(raw, eLvl){
  if(P.inv>0 || P.dead) return;
  const dmg = mitigate(raw, eLvl||zoneLvl());
  P.hp -= dmg; P.flash = 0.18; P.an.hurt = 1;
  if(D.uniq && D.uniq.bulwark){ P.bulwark = Math.min(3,P.bulwark+1); P.bulwarkT = 3; }
  fct(P.x,P.y-26,'-'+Math.round(dmg),'player');
  const el=$('hitFlash'); el.style.opacity = clamp(dmg/D.maxHp*4,0.18,0.85);
  setTimeout(()=>{el.style.opacity=0;},110);
  shake = Math.max(shake, clamp(dmg/D.maxHp*40,3,14));
  sfx('hurt'); buzz(28);
  if(P.hp<=0) playerDeath();
}
function killFoe(f){
  const i = foes.indexOf(f); if(i<0) return;
  foes.splice(i,1);
  /* leave a body that collapses rather than popping out of existence */
  if(corpses.length<14) corpses.push({corpse:1, def:f.def, x:f.x, y:f.y, r:f.r,
    t:0, time:f.t, an:{ph:f.an.ph, walk:0, atk:-1, hurt:0, flip:f.an.flip}});
  burst(f.x,f.y,f.def.col,14,200,0.55,3);
  ring(f.x,f.y,f.def.col,f.r*0.5,f.r*2.4,0.3);
  sfx('kill');

  /* poison contagion */
  if(D.uniq && D.uniq.poison && f.pois>0){
    for(const o of foes) if(Math.hypot(o.x-f.x,o.y-f.y)<95){ o.pois=4; o.poisD=Math.max(o.poisD,f.poisD); }
  }
  /* bomber detonates */
  if(f.def.ai==='bomber') detonate(f);
  /* splitter */
  if(f.def.ai==='splitter' && f.rank===0 && !f.isSplit){
    for(let k=0;k<2;k++){
      const c = makeFoe(f.def,0);
      c.isSplit=1; c.x=f.x+rnd(-18,18); c.y=f.y+rnd(-18,18);
      c.r=f.def.size*0.6; c.max=c.max*0.35; c.hp=c.max; c.dmg*=0.6; c.spd*=1.3;
      foes.push(c);
    }
  }
  if(f===bossRef){ bossRef=null; $('bossBar').classList.remove('on'); }

  kills++; S.meta.kills++;
  S.zoneKills[S.zone] = (S.zoneKills[S.zone]||0)+1;
  gainXp(TUNE.eXp(f.lvl, f.rank));
  rollDrops(f);
  elitePity++; bossPity++; chestPity++;
}
function detonate(f){
  ring(f.x,f.y,'#ff9a4c',10,86,0.32);
  burst(f.x,f.y,'#ff9a4c',22,280,0.5,3.5);
  const d = Math.hypot(P.x-f.x,P.y-f.y);
  if(d<86) hurtPlayer(f.dmg*1.6*(1-d/86)+f.dmg*0.4, f.lvl);
  shake=Math.max(shake,9);
}

   DROPS
   ================================================================ */
function rollDrops(f){
  const z = ZONE_BY_ID[S.zone], rank = f.rank;
  const gf = 1 + D.goldF/100;
  /* gold */
  const g = Math.round(rnd(3,8)*(1+f.lvl*0.55)*(1+rank*2.4)*gf*z.tier*0.7);
  gainGold(g);
  drops.push({x:f.x,y:f.y,t:'gold',v:g,life:0,vx:rnd(-30,30),vy:rnd(-60,-20)});

  /* materials */
  const mChance = 0.20 + rank*0.30;
  if(Math.random()<mChance){
    const m = Math.random()<0.86 ? z.mats[0] : z.mats[1];
    const q = m===z.mats[1] ? 1 : rint(1,1+z.tier);
    addMat(m,q);
    drops.push({x:f.x,y:f.y,t:'mat',k:m,v:q,life:0,vx:rnd(-30,30),vy:rnd(-60,-20)});
  }
  if(rank===2){ addMat(z.cat,1); drops.push({x:f.x,y:f.y,t:'mat',k:z.cat,v:1,life:0,vx:0,vy:-40}); }

  /* gear */
  const iChance = rank===2 ? 1 : rank===1 ? 0.5 : 0.075;
  const n = rank===2 ? 3 : 1;
  for(let i=0;i<n;i++){
    if(Math.random()>iChance) continue;
    const it = genZoneItem(z, rank);
    if(bagAdd(it)){
      drops.push({x:f.x+rnd(-10,10),y:f.y,t:'item',it,life:0,vx:rnd(-40,40),vy:rnd(-70,-30)});
      sfx('loot', it.rar);
      if(it.rar>=3){ toast(RARITY[it.rar].name+': '+it.name); shake=Math.max(shake,6); buzz(60); }
      markAlert();
    } else toast('Backpack full!');
  }
}
function genZoneItem(z, rank){
  const ilvl = clamp(Math.round(zoneLvl() + rnd(-1,2) + rank*2), 1, 99);
  const rar  = rollRarity(z.tier, rank, D.luck);
  const kindRoll = Math.random();
  if(kindRoll<0.34) return rollItem({kind:'weapon',ilvl,rar});
  if(kindRoll<0.72) return rollItem({kind:'armor',ilvl,rar});
  if(kindRoll<0.86) return rollItem({kind:'offhand',ilvl,rar});
  return rollItem({kind:'trinket',ilvl,rar});
}
function spawnChest(){
  chest = {x:rnd(60,W-60), y:rnd(110,H-130), r:16, t:0, opened:false};
  toast('✦ A treasure chest materialises');
  sfx('cast');
}
function openChest(){
  if(!chest || chest.opened) return;
  chest.opened = true;
  S.meta.chests++;
  const z = ZONE_BY_ID[S.zone];
  const got = [];
  const n = rint(2,3);
  for(let i=0;i<n;i++){
    const ilvl = clamp(Math.round(zoneLvl()+rnd(0,3)),1,99);
    const rar  = Math.max(1, rollRarity(z.tier, 1.4, D.luck));
    const k = pick(['weapon','armor','armor','offhand','trinket']);
    const it = rollItem({kind:k, ilvl, rar});
    if(bagAdd(it)) got.push(it);
  }
  const g = Math.round(rnd(40,90)*z.tier*(1+zoneLvl()*0.4)*(1+D.goldF/100));
  gainGold(g);
  addMat(z.mats[0], rint(2,4+z.tier));
  burst(chest.x,chest.y,'#e8b44a',34,240,0.7,3.5);
  ring(chest.x,chest.y,'#e8b44a',8,110,0.45);

}

const UNARMED = {n:'Fists',cls:'melee',stat:'str',ic:'✊',dmg:0.5,spd:1.4,rng:50,arc:1.2,pat:'arc',mp:0};
function curWeapon(){ const w=S.equip.weapon; return (w&&WEAPONS[w.arch])||UNARMED; }

let mv = {x:0,y:0,active:false,id:null};
const stickEl=$('stick'), nubEl=$('stickNub'), stickZone=$('stickZone');
let stickBase={x:0,y:0};

function stickStart(e){
  const t = e.changedTouches? e.changedTouches[0] : e;
  const r = $('arenaWrap').getBoundingClientRect();
  mv.active=true; mv.id = t.identifier!=null?t.identifier:'m';
  stickBase = {x:t.clientX-r.left, y:t.clientY-r.top};
  stickEl.style.left = (stickBase.x-56)+'px';
  stickEl.style.top  = (stickBase.y-56)+'px';
  stickEl.classList.add('on');
  stickMove(e);
}
function stickMove(e){
  if(!mv.active) return;
  const list = e.changedTouches||[e];
  let t=null;
  for(const c of list){ if((c.identifier!=null?c.identifier:'m')===mv.id) t=c; }
  if(!t) return;
  const r = $('arenaWrap').getBoundingClientRect();
  let dx = (t.clientX-r.left)-stickBase.x, dy = (t.clientY-r.top)-stickBase.y;
  const d = Math.hypot(dx,dy), max = 46;
  if(d>max){ dx = dx/d*max; dy = dy/d*max; }
  nubEl.style.transform = 'translate('+dx+'px,'+dy+'px)';
  const mag = Math.min(1, d/max);
  if(d>3){ mv.x = (dx/Math.max(d,1))*mag; mv.y = (dy/Math.max(d,1))*mag; }
  else { mv.x=0; mv.y=0; }
}
function stickEnd(e){
  const list = e.changedTouches||[e];
  for(const c of list){
    if((c.identifier!=null?c.identifier:'m')===mv.id){
      mv.active=false; mv.x=0; mv.y=0; mv.id=null;
      nubEl.style.transform='none'; stickEl.classList.remove('on');
    }
  }
}

/* keyboard (desktop testing) */
const keys={};
window.addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()]=1;
  if(e.key===' '){ e.preventDefault(); atkHeld=true; }
  if(e.key.toLowerCase()==='q') useSkill();
  if(e.key.toLowerCase()==='e') doDash();
  if(e.key.toLowerCase()==='r') usePotion();
  if(e.key.toLowerCase()==='f' && chest) openChest();
});
window.addEventListener('keyup',e=>{
  keys[e.key.toLowerCase()]=0;
  if(e.key===' ') atkHeld=false;
});
function keyVec(){
  let x=0,y=0;
  if(keys['a']||keys['arrowleft'])x--; if(keys['d']||keys['arrowright'])x++;
  if(keys['w']||keys['arrowup'])y--;   if(keys['s']||keys['arrowdown'])y++;
  const m=Math.hypot(x,y); return m? {x:x/m,y:y/m}:{x:0,y:0};
}

/* action buttons */
let atkHeld=false;
function bindHold(el, onDown, onUp){
  el.addEventListener('touchstart', e=>{e.preventDefault();onDown();}, {passive:false});
  el.addEventListener('touchend',   e=>{e.preventDefault();if(onUp)onUp();}, {passive:false});
  el.addEventListener('touchcancel',()=>{if(onUp)onUp();});
  el.addEventListener('mousedown',  e=>{e.preventDefault();onDown();});
  el.addEventListener('mouseup',    ()=>{if(onUp)onUp();});
  el.addEventListener('mouseleave', ()=>{if(onUp)onUp();});
}

/* ================================================================
   PLAYER ACTIONS
   ================================================================ */
function nearestFoe(maxD){
  let best=null, bd=maxD*maxD;
  for(const f of foes){
    const d=(f.x-P.x)**2+(f.y-P.y)**2;
    if(d<bd){bd=d;best=f;}
  }
  return best;
}
function aimAt(){
  const A = curWeapon();
  const t = nearestFoe(A.pat==='arc' ? A.rng+60 : A.rng);
  if(t){ const d=Math.hypot(t.x-P.x,t.y-P.y)||1; return {x:(t.x-P.x)/d,y:(t.y-P.y)/d,t}; }
  return null;
}
function spawnShot(ang, A, mult, extra){
  const U = D.uniq||{};
  let pierce = (A.pierce||0) + (U.pierceAll?3:0);
  const h = rollHit(mult);
  shots.push(Object.assign({
    x:P.x+Math.cos(ang)*16, y:P.y+Math.sin(ang)*16,
    vx:Math.cos(ang)*(A.ps||460), vy:Math.sin(ang)*(A.ps||460),
    r:A.splash?7:5, dmg:h.dmg, crit:h.crit, own:'p', life:1.6,
    col: A.cls==='magic' ? '#8ab4ff' : '#dfe7ff',
    pierce, hitSet:new Set(),
    splash:A.splash||0, slow:A.slow||0,
    chain: U.superchain?6:(A.chain||0), chainAmp: U.superchain?0.12:0,
    homing:A.homing?1:0,
  }, extra||{}));
}
function doAttack(){
  if(P.atkCd>0 || P.dead) return;
  const A = curWeapon();
  if(A.mp>0 && P.mp < A.mp){ if(!P.noManaT){P.noManaT=1; toast('Out of mana'); sfx('no'); setTimeout(()=>P.noManaT=0,900);} return; }
  const aim = aimAt();
  if(!aim && S.opts.autoAim && !atkHeld) return;
  const dir = aim || {x:P.fx,y:P.fy};
  const ang = Math.atan2(dir.y,dir.x);
  P.fx=Math.cos(ang); P.fy=Math.sin(ang);
  P.atkCd = D.atkTime; P.an.atk = 0;
  if(A.mp>0) P.mp = Math.max(0,P.mp-A.mp);

  if(A.pat==='arc'){
    sfx('hit');
    fx.push({type:'arc',x:P.x,y:P.y,ang,arc:A.arc,rng:A.rng,t:0,life:0.18,
      col: S.equip.weapon && S.equip.weapon.rar>=3 ? RARITY[S.equip.weapon.rar].col : '#dfe7ff'});
    meleeHit(ang, A, 1);
    if(D.uniq && D.uniq.cleaveShock){
      spawnShot(ang, {ps:360,cls:'melee'}, 0.6, {col:'#ffb27a',r:10,pierce:6,life:0.7});
    }
  } else {
    sfx(A.cls==='magic'?'cast':'shoot');
    const n = A.multi||1;
    for(let i=0;i<n;i++){
      const off = n>1 ? (i-(n-1)/2)*(A.spread||0.22) : 0;
      spawnShot(ang+off, A, n>1?1:1);
    }
  }
}
function meleeHit(ang, A, mult){
  const U = D.uniq||{};
  let any=false;
  for(const f of foes.slice()){
    const dx=f.x-P.x, dy=f.y-P.y, d=Math.hypot(dx,dy);
    if(d > A.rng + f.r) continue;
    let da = Math.atan2(dy,dx)-ang;
    while(da>Math.PI) da-=6.283; while(da<-Math.PI) da+=6.283;
    if(Math.abs(da) > A.arc/2) continue;
    let m = mult;
    if(U.bleed){
      const k = 'f'+(f.uidk||(f.uidk=uidSeq++));
      P.hitStreak[k] = Math.min(10,(P.hitStreak[k]||0)+1);
      m *= 1 + P.hitStreak[k]*0.06;
    }
    const h = rollHit(m);
    damageFoe(f,h.dmg,h.crit);
    if(A.stagger) f.stun = Math.max(f.stun,0.35);
    any=true;
  }
  if(any) buzz(12);
}
function doDash(){
  if(P.dashCd>0||P.dead) return;
  let dx=mv.x,dy=mv.y;
  if(!dx&&!dy){ const k=keyVec(); dx=k.x; dy=k.y; }
  if(!dx&&!dy){ dx=P.fx; dy=P.fy; }
  const m=Math.hypot(dx,dy)||1;
  P.dvx=dx/m*760; P.dvy=dy/m*760;
  P.dashT=0.17; P.inv=0.32; P.dashCd=4.0;
  burst(P.x,P.y,'#9ec4ff',12,150,0.4,2.5);
  sfx('dash'); buzz(18);
}
function useSkill(){
  if(P.skillCd>0||P.dead) return;
  const cls = D.wpnCls;
  const cost = 12 + S.lvl;
  if(P.mp<cost){ toast('Not enough mana'); sfx('no'); return; }
  P.mp -= cost; P.skillCd = 8;
  const A = curWeapon();
  if(cls==='melee'){
    toast('Whirlwind!');
    for(let i=0;i<3;i++) setTimeout(()=>{
      if(P.dead) return;
      const a = i*2.1;
      fx.push({type:'arc',x:P.x,y:P.y,ang:a,arc:6.283,rng:A.rng+26,t:0,life:0.2,col:'#ffd85e'});
      meleeHit(a,{rng:A.rng+26,arc:6.283},1.4);
      shake=Math.max(shake,5); sfx('crit');
    }, i*170);
    ring(P.x,P.y,'#ffd85e',10,A.rng+30,0.4);
  } else if(cls==='range'){
    toast('Volley!');
    const aim = aimAt() || {x:P.fx,y:P.fy};
    const base = Math.atan2(aim.y,aim.x);
    for(let i=0;i<10;i++) spawnShot(base+(i-4.5)*0.13, A, 0.9);
    sfx('shoot'); shake=Math.max(shake,4);
  } else {
    toast('Arcane Nova!');
    ring(P.x,P.y,'#8ab4ff',12,230,0.5);
    burst(P.x,P.y,'#8ab4ff',30,300,0.6,3);
    for(const f of foes.slice()){
      const d=Math.hypot(f.x-P.x,f.y-P.y);
      if(d<230){ const h=rollHit(2.2*(1-d/300)); damageFoe(f,h.dmg,h.crit); }
    }
    sfx('crit'); shake=Math.max(shake,8);
  }
  buzz(30);
}
function usePotion(){
  if(P.potCd>0||P.dead) return;
  let key = S.potSel;
  if(!S.pots[key]) key = ['pot_l','pot_m','pot_s'].find(k=>S.pots[k]>0);
  if(!key){ toast('No draughts left'); sfx('no'); return; }
  const def = SHOP.find(s=>s.id===key);
  S.pots[key]--; S.potSel = key;
  P.potCd = 6;
  healPlayer(D.maxHp*def.heal);
  burst(P.x,P.y,'#5ed39a',16,150,0.5,2.6);
  ring(P.x,P.y,'#5ed39a',8,42,0.35);
  sfx('pot'); buzz(20);
  syncPotBtn();
}
function playerDeath(){
  if(P.dead) return;
  P.dead=true; P.hp=0;
  S.meta.deaths++;
  const lost = Math.round(S.gold*0.10);
  S.gold -= lost;
  burst(P.x,P.y,'#e0455a',40,280,0.9,4);
  sfx('die'); buzz([60,50,120]);
  paused = true;
  $('deathTxt').innerHTML = 'The '+ZONE_BY_ID[S.zone].n+' claims you.<br>'+
    'Lost <span class="goldTxt">'+fmt(lost)+'g</span> · Kept all gear.<br>'+
    '<span style="color:var(--dim2);font-size:11px;">'+kills+' kills this run</span>';
  $('deathWrap').classList.add('open');
  saveGame();
}

/* ================================================================
   UPDATE
   ================================================================ */
function update(dt){
  const z = ZONE_BY_ID[S.zone];

  /* snapshot positions so the animation pass can derive real travelled
     distance (after AI *and* separation) to drive walk cycles */
  P.px=P.x; P.py=P.y;
  for(const f of foes){ f.px=f.x; f.py=f.y; }

  /* ---- player ---- */
  if(!P.dead){
    let ix=mv.x, iy=mv.y;
    if(!ix&&!iy){ const k=keyVec(); ix=k.x; iy=k.y; }
    if(P.dashT>0){
      P.dashT-=dt; P.x+=P.dvx*dt; P.y+=P.dvy*dt;
      if(parts.length<200) parts.push({x:P.x,y:P.y,vx:0,vy:0,life:0.22,max:0.22,col:'#9ec4ff',r:5});
    } else if(ix||iy){
      const sp = D.moveSpeed;
      P.x += ix*sp*dt; P.y += iy*sp*dt;
      const m=Math.hypot(ix,iy)||1; P.fx=ix/m; P.fy=iy/m;
    }
    P.x = clamp(P.x, 16, W-16); P.y = clamp(P.y, 58, H-16);

    P.atkCd  = Math.max(0,P.atkCd-dt);
    P.dashCd = Math.max(0,P.dashCd-dt);
    P.skillCd= Math.max(0,P.skillCd-dt);
    P.potCd  = Math.max(0,P.potCd-dt);
    P.inv    = Math.max(0,P.inv-dt);
    P.flash  = Math.max(0,P.flash-dt);
    if(P.bulwarkT>0){ P.bulwarkT-=dt; if(P.bulwarkT<=0) P.bulwark=0; }

    /* regen */
    let hr = D.hpReg;
    if(D.uniq && D.uniq.regenSurge && P.hp < D.maxHp*0.4) hr*=2;
    P.hp = Math.min(D.maxHp, P.hp + hr*dt);
    P.mp = Math.min(D.maxMp, P.mp + D.mpReg*dt);

    /* auto / held attack */
    if(atkHeld || S.opts.autoAim) doAttack();
  }

  /* ---- foes ---- */
  for(let i=foes.length-1;i>=0;i--){
    const f = foes[i];
    f.t += dt; f.born += dt;
    f.flash = Math.max(0,f.flash-dt);
    f.icd   = Math.max(0,f.icd-dt);
    f.stun  = Math.max(0,f.stun-dt);
    if(f.slow>0){ f.slow-=dt; if(f.slow<=0) f.slowA=0; }
    if(f.burn>0){ f.burn-=dt; f.hp-=f.burnD*dt;
      if(Math.random()<dt*7) burst(f.x,f.y,'#ff9a4c',1,40,0.3,2); }
    if(f.pois>0){ f.pois-=dt; f.hp-=f.poisD*dt;
      if(Math.random()<dt*6) burst(f.x,f.y,'#a3e635',1,34,0.35,2); }
    if(f.hp<=0){ killFoe(f); continue; }

    /* materialising: visible and damageable, but inert */
    const warpT = f.warp||0.42;
    if(f.born < warpT){
      if(f.born<0.05) burst(f.x,f.y,f.def.col,8,110,0.4,2.2);
      continue;
    }

    const dx=P.x-f.x, dy=P.y-f.y, d=Math.hypot(dx,dy)||1;
    const nx=dx/d, ny=dy/d;
    const sp = f.spd*(1-(f.slowA||0))*(f.stun>0?0:1);
    const ai = f.def.ai;

    if(ai==='chase' || ai==='splitter'){
      f.x+=nx*sp*dt; f.y+=ny*sp*dt;
    }
    else if(ai==='charger'){
      if(f.st===0){ if(d>150){ f.x+=nx*sp*dt; f.y+=ny*sp*dt; } else { f.st=1; f.patT=0.5; f.tele=1; } }
      else if(f.st===1){ f.patT-=dt; if(f.patT<=0){ f.st=2; f.patT=0.4; f.tele=0; f.cvx=nx*sp*3.4; f.cvy=ny*sp*3.4; } }
      else if(f.st===2){ f.patT-=dt; f.x+=f.cvx*dt; f.y+=f.cvy*dt; if(f.patT<=0){ f.st=3; f.patT=0.55; } }
      else { f.patT-=dt; if(f.patT<=0) f.st=0; }
    }
    else if(ai==='shooter'){
      const want = (f.def.srng||280)*0.72;
      if(d<want-40){ f.x-=nx*sp*dt; f.y-=ny*sp*dt; }
      else if(d>want+40){ f.x+=nx*sp*dt; f.y+=ny*sp*dt; }
      else { f.x+=-ny*sp*0.6*dt; f.y+=nx*sp*0.6*dt; }
      f.patT-=dt;
      if(f.patT<=0 && f.stun<=0){ f.patT = 1.9; foeShoot(f,nx,ny); }
    }
    else if(ai==='orbiter'){
      f.ang += dt*1.1*(f.spd/60);
      const R = 165;
      const tx = P.x+Math.cos(f.ang)*R, ty = P.y+Math.sin(f.ang)*R;
      const ox=tx-f.x, oy=ty-f.y, od=Math.hypot(ox,oy)||1;
      f.x+=ox/od*sp*dt; f.y+=oy/od*sp*dt;
      if(f.def.shoot){ f.patT-=dt; if(f.patT<=0&&f.stun<=0){ f.patT=2.2; foeShoot(f,nx,ny); } }
    }
    else if(ai==='bomber'){
      f.x+=nx*sp*dt; f.y+=ny*sp*dt;
      if(d<52 && !f.fuse){ f.fuse=0.55; }
      if(f.fuse){ f.fuse-=dt; f.tele=1; if(f.fuse<=0){ detonate(f); f.hp=0; killFoe(f); continue; } }
    }
    else if(ai==='boss'){
      bossAI(f,dt,nx,ny,d);
    }

    /* contact damage */
    if(ai!=='shooter' && d < f.r+P.r+2 && f.icd<=0 && !P.dead){
      f.icd = 0.85; f.an.atk = 0;
      hurtPlayer(f.dmg*(f.rank===2?1.35:1), f.lvl);
      if(D.thorns>0) damageFoe(f, D.thorns, false, {silent:true,noProc:true});
    }
    f.x = clamp(f.x,-40,W+40); f.y = clamp(f.y,-40,H+40);
  }

  /* ---- soft separation ----
     Without this a pack piles onto one pixel and reads as a single blob.
     O(n^2) but n is capped at ~18, so it costs nothing. Ranked enemies
     barely budge, so elites and bosses shove trash aside instead of orbiting. */
  for(let i=0;i<foes.length;i++){
    const a = foes[i];
    if(a.born < (a.warp||0.42)) continue;
    for(let j=i+1;j<foes.length;j++){
      const b = foes[j];
      if(b.born < (b.warp||0.42)) continue;
      const dx=b.x-a.x, dy=b.y-a.y, min=(a.r+b.r)*0.82, d2=dx*dx+dy*dy;
      if(d2>min*min || d2<0.01) continue;
      const d=Math.sqrt(d2), ov=(min-d)/d*0.5;
      const px=dx*ov, py=dy*ov;
      const aw = a.rank?0.22:1, bw = b.rank?0.22:1;
      a.x-=px*aw; a.y-=py*aw; b.x+=px*bw; b.y+=py*bw;
    }
  }

  /* ---- animation ----
     Walk cycles are driven by distance actually travelled this frame, so a
     slowed or shoved enemy's legs stay in sync with its real motion. */
  P.t += dt;
  const pMoved = Math.hypot(P.x-P.px, P.y-P.py);
  if(P.an.atk>=0 && Math.abs(P.fx)>0.15)   P.an.flip = P.fx<0?-1:1;
  else if(pMoved>0.4)                      P.an.flip = (P.x-P.px)<0?-1:1;
  stepAnim(P.an, P, dt, pMoved);
  for(const f of foes){
    const m = Math.hypot(f.x-f.px, f.y-f.py);
    if(m>0.4) f.an.flip = (f.x-f.px)<0?-1:1;
    else      f.an.flip = (P.x-f.x)<0?-1:1;
    stepAnim(f.an, f, dt, f.born < (f.warp||0.42) ? 0 : m);
  }
  for(let i=corpses.length-1;i>=0;i--){
    const c=corpses[i]; c.t+=dt; c.time+=dt;
    if(c.t>0.80) corpses.splice(i,1);
  }

  /* ---- projectiles ---- */
  for(let i=shots.length-1;i>=0;i--){
    const s = shots[i];
    s.life-=dt;
    if(s.homing && s.own==='p'){
      const t = nearestFoe(400);
      if(t){
        const a=Math.atan2(t.y-s.y,t.x-s.x), cs=Math.hypot(s.vx,s.vy);
        s.vx = lerp(s.vx, Math.cos(a)*cs, dt*4.5);
        s.vy = lerp(s.vy, Math.sin(a)*cs, dt*4.5);
      }
    }
    s.x+=s.vx*dt; s.y+=s.vy*dt;
    if(s.life<=0 || s.x<-30||s.x>W+30||s.y<-30||s.y>H+30){ shots.splice(i,1); continue; }

    if(s.own==='p'){
      for(const f of foes.slice()){
        if(s.hitSet.has(f)) continue;
        if(Math.hypot(f.x-s.x,f.y-s.y) > f.r+s.r) continue;
        s.hitSet.add(f);
        damageFoe(f, s.dmg, s.crit);
        if(s.slow){ f.slow=Math.max(f.slow,1.6); f.slowA=Math.max(f.slowA,s.slow); }
        if(s.splash){
          ring(s.x,s.y,'#ffb27a',6,s.splash,0.26);
          burst(s.x,s.y,'#ffb27a',10,190,0.35,2.6);
          for(const o of foes.slice()) if(o!==f && Math.hypot(o.x-s.x,o.y-s.y)<s.splash)
            damageFoe(o, s.dmg*0.6, false, {silent:false});
        }
        if(s.chain>0){
          let best=null,bd=170*170;
          for(const o of foes) if(!s.hitSet.has(o)){
            const dd=(o.x-s.x)**2+(o.y-s.y)**2; if(dd<bd){bd=dd;best=o;}
          }
          if(best){
            const a=Math.atan2(best.y-s.y,best.x-s.x), cs=Math.hypot(s.vx,s.vy);
            s.vx=Math.cos(a)*cs; s.vy=Math.sin(a)*cs;
            s.chain--; s.dmg*=(1+(s.chainAmp||0)); s.life=Math.max(s.life,0.6);
            fx.push({type:'bolt',x1:s.x,y1:s.y,x2:best.x,y2:best.y,t:0,life:0.14,col:'#c8e0ff'});
            continue;
          } else s.chain=0;
        }
        if(s.pierce>0){ s.pierce--; }
        else { shots.splice(i,1); break; }
      }
    } else {
      if(!P.dead && Math.hypot(P.x-s.x,P.y-s.y) < P.r+s.r){
        hurtPlayer(s.dmg, s.lvl);
        burst(s.x,s.y,s.col,8,140,0.3,2.2);
        shots.splice(i,1); continue;
      }
    }
  }

  /* ---- particles / fx / drops ---- */
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i]; p.life-=dt;
    if(p.life<=0){parts.splice(i,1);continue;}
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.94; p.vy*=0.94;
  }
  for(let i=fx.length-1;i>=0;i--){ fx[i].t+=dt; if(fx[i].t>=fx[i].life) fx.splice(i,1); }
  for(let i=drops.length-1;i>=0;i--){
    const d=drops[i]; d.life+=dt;
    d.x+=d.vx*dt; d.y+=d.vy*dt; d.vy+=150*dt; d.vx*=0.95;
    if(d.life>1.1) drops.splice(i,1);
  }

  /* ---- spawns ---- */
  waveT -= dt;
  if(waveT<=0){ waveT = Math.max(0.25, 1.1 - z.tier*0.12); spawnWave(); }
  if(!bossRef && elitePity>=22){ elitePity=0; spawnElite(); }
  if(!bossRef && bossPity>=75){ bossPity=0; spawnBoss(); }
  if(!chest && chestPity>=32){ chestPity=0; spawnChest(); }

  /* chest prompt */
  if(chest){
    chest.t+=dt;
    const near = Math.hypot(P.x-chest.x,P.y-chest.y) < 54;
    $('prompt').style.display = near?'block':'none';
  }

  if(shake>0) shake = Math.max(0, shake-dt*36);
  syncHud();
}

function foeShoot(f,nx,ny){
  f.an.atk = 0;
  const a = Math.atan2(ny,nx);
  const sp = f.def.ps||320;
  shots.push({x:f.x,y:f.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:6,
    dmg:f.dmg*0.85,own:'e',life:2.6,col:f.def.col,lvl:f.lvl,hitSet:new Set()});
  sfx('shoot');
}

/* ---- boss ---- */
function bossAI(f,dt,nx,ny,d){
  f.patT -= dt;
  if(f.phase==null){ f.phase=-1; f.patT=1.4; f.cycle=0; }
  if(f.phase===-1){
    if(d>190){ f.x+=nx*f.spd*dt; f.y+=ny*f.spd*dt; }
    else { f.x+=nx*f.spd*0.35*dt; f.y+=ny*f.spd*0.35*dt; }
    if(f.patT<=0){
      const seq=[0,1,2,0,1,3];
      f.phase = seq[f.cycle%seq.length]; f.cycle++;
      f.patT = f.phase===1?0.8:f.phase===2?0.9:f.phase===3?0.6:1.5;
      if(f.phase===1||f.phase===2){ f.tele=1; f.tx=P.x; f.ty=P.y; }
      if(f.phase===0) f.shotT=0;
    }
    return;
  }
  if(f.phase===0){ /* radial barrage */
    f.shotT-=dt;
    if(f.shotT<=0){
      f.shotT=0.5;
      const base=rnd(0,6.28), n=10+f.def.size/8|0;
      for(let i=0;i<n;i++){
        const a=base+i*6.283/n, sp=f.def.ps||340;
        shots.push({x:f.x,y:f.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:7,
          dmg:f.dmg*0.7,own:'e',life:3,col:f.def.col,lvl:f.lvl,hitSet:new Set()});
      }
      sfx('shoot'); shake=Math.max(shake,4);
    }
    if(f.patT<=0){ f.phase=-1; f.patT=1.2; }
  }
  else if(f.phase===1){ /* charge */
    if(f.tele){
      if(f.patT<=0){ f.tele=0; f.patT=0.75;
        const a=Math.atan2(f.ty-f.y,f.tx-f.x);
        f.cvx=Math.cos(a)*f.spd*4.2; f.cvy=Math.sin(a)*f.spd*4.2; f.an.atk=0; sfx('dash'); }
    } else {
      f.x+=f.cvx*dt; f.y+=f.cvy*dt;
      if(f.patT<=0){ f.phase=-1; f.patT=1.1; shake=Math.max(shake,6); }
    }
  }
  else if(f.phase===2){ /* slam */
    if(f.tele && f.patT<=0){
      f.tele=0; f.patT=0.25;
      ring(f.tx,f.ty,'#ff5a3c',18,130,0.34);
      burst(f.tx,f.ty,'#ff5a3c',26,280,0.55,3.4);
      if(Math.hypot(P.x-f.tx,P.y-f.ty)<130) hurtPlayer(f.dmg*1.8,f.lvl);
      shake=Math.max(shake,13); sfx('crit'); buzz(50);
    } else if(!f.tele && f.patT<=0){ f.phase=-1; f.patT=1.3; }
  }
  else if(f.phase===3){ /* summon */
    if(f.patT<=0){
      const z=ZONE_BY_ID[S.zone];
      for(let i=0;i<4;i++){
        const c=makeFoe(pick(z.enemies),0);
        const a=Math.random()*6.283;
        c.x=f.x+Math.cos(a)*60; c.y=f.y+Math.sin(a)*60;
        burst(c.x,c.y,z.accent,10,150,0.4,2.4);
        foes.push(c);
      }
      toast(f.def.n+' calls for aid'); sfx('cast');
      f.phase=-1; f.patT=1.2;
    }
  }
}

/* ================================================================
   RENDER
   ================================================================ */
/* ================================================================
   SPRITE ENGINE — rigged skeletal characters
   ----------------------------------------------------------------
   Every character is a bone hierarchy. Each bone bakes its shaded
   body part into a small offscreen canvas ONCE (gradient + outline +
   specular), so a frame is just drawImage per bone. Animation is
   procedural: pose() writes joint angles per frame, which gives real
   interpolated motion (walk cycles, anticipation, follow-through,
   flinch, collapse) instead of a fixed flipbook.

   Bone space: local +X runs along the bone, +Y is perpendicular.
   A bone's `ox,oy` offset is expressed in the PARENT's space and in
   units of the entity radius, so rigs scale to any enemy size.
   `dx,dy` shift only the drawn sprite, never the children's joints —
   that lets an orb be centred on its joint without moving the chain.
   ================================================================ */

function hex2rgb(h){
  h = h.replace('#','');
  if(h.length===3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];
}
function shade(hex, amt){
  const [r,g,b] = hex2rgb(hex);
  const t = amt>0?255:0, k = Math.abs(amt);
  const h = v => Math.round(lerp(v,t,k)).toString(16).padStart(2,'0');
  return '#'+h(r)+h(g)+h(b);
}
function lum(hex){ const [r,g,b]=hex2rgb(hex); return (0.299*r+0.587*g+0.114*b)/255; }
const palCache = {};
function paletteFor(col, col2){
  const key = col+col2;
  if(palCache[key]) return palCache[key];
  /* Ice/bone enemies are already near-white; without pulling the base down
     the shading has nowhere to go and they render as flat white silhouettes. */
  const L = lum(col);
  const base  = L>0.70 ? shade(col, -(L-0.70)*1.15) : col;
  const base2 = lum(col2)>0.70 ? shade(col2,-(lum(col2)-0.70)*1.15) : col2;
  const p = { key,
    out:  shade(base2,-0.70),
    dark: shade(base2,-0.10),
    mid:  base,
    lite: shade(base, 0.24),
    rim:  shade(base, 0.50),
    glow: shade(col,  0.72) };
  palCache[key] = p; return p;
}

/* ---------- baked body parts ---------- */
const partCache = {}; let partOrder = [];
const PAD = 5;
function bakePart(shape, len, wid, pal, role, taper){
  len = Math.max(4, Math.round(len)); wid = Math.max(4, Math.round(wid));
  taper = taper==null?1:taper;
  const key = shape+'_'+len+'_'+wid+'_'+role+'_'+taper+'_'+pal.key;
  const hit = partCache[key]; if(hit) return hit;
  if(partOrder.length > 1400) delete partCache[partOrder.shift()];
  partOrder.push(key);

  const cw = len+PAD*2, ch = wid+PAD*2;
  const c = document.createElement('canvas');
  c.width = cw; c.height = ch;
  const g = c.getContext('2d');
  g.translate(PAD, PAD+wid/2);
  paintPart(g, shape, len, wid, pal, role, taper);
  const out = {cv:c, ox:PAD, oy:PAD+wid/2};
  partCache[key] = out; return out;
}

/* Paints one body part at the current origin (bone base, vertically centred). */
function paintPart(g, shape, len, wid, pal, role, taper){
  taper = taper==null?1:taper;
  const base = pal[role] || pal.mid;
  g.beginPath();
  if(shape==='orb'){
    g.ellipse(len/2, 0, len/2, wid/2, 0, 0, 6.283);
  } else if(shape==='tri'){
    g.moveTo(0,-wid/2); g.lineTo(len,0); g.lineTo(0,wid/2); g.closePath();
  } else if(shape==='wing'){
    g.moveTo(0,-wid*0.05);
    g.bezierCurveTo(len*0.34,-wid*0.60, len*0.84,-wid*0.44, len,-wid*0.02);
    g.bezierCurveTo(len*0.78, wid*0.28, len*0.38, wid*0.36, 0, wid*0.22);
    g.closePath();
  } else if(shape==='blade'){
    g.moveTo(0,-wid/2); g.lineTo(len*0.82,-wid*0.34);
    g.lineTo(len,0); g.lineTo(len*0.82, wid*0.34); g.lineTo(0, wid/2); g.closePath();
  } else {                                  /* capsule */
    const r0 = wid/2, r1 = Math.max(1.2, wid/2*taper);
    g.moveTo(0,-r0); g.lineTo(len,-r1);
    g.arc(len,0,r1,-1.5708,1.5708);
    g.lineTo(0,r0);
    g.arc(0,0,r0,1.5708,-1.5708,true);
    g.closePath();
  }

  const L  = lum(base);
  const up = lerp(0.54, 0.14, L), dn = lerp(-0.32,-0.50,L);
  const grd = g.createLinearGradient(0,-wid/2,0,wid/2);
  grd.addColorStop(0,    shade(base, up));
  grd.addColorStop(0.26, shade(base, up*0.40));
  grd.addColorStop(0.62, base);
  grd.addColorStop(1,    shade(base, dn));
  g.fillStyle = grd; g.fill();
  g.lineWidth = Math.max(1.5, wid*0.11);
  g.strokeStyle = pal.out; g.stroke();
  /* specular sheen, clipped to the part */
  g.save(); g.clip();
  g.globalAlpha = 0.22; g.fillStyle = '#ffffff';
  g.beginPath(); g.ellipse(len*0.40,-wid*0.25, len*0.38, wid*0.14, 0,0,6.283); g.fill();
  g.restore();
}

/* ---------- rig compilation ----------
   Resolve draw order, bone indices and parent indices once, and pre-allocate
   every per-frame object. The naive version rebuilt an angle map with `delete`
   (drops the object into V8 dictionary mode) and allocated a transform object
   per bone per frame — together that cost ~40% of the frame budget. */
for(const k in RIGS){
  const R = RIGS[k];
  R.draw = R.bones.slice().sort((a,b)=>a.z-b.z);
  const idx = {};
  R.bones.forEach((b,i)=>{ b.i=i; idx[b.n]=i; });
  R.bones.forEach(b=>{ b.pi = b.p!=null && idx[b.p]!=null ? idx[b.p] : -1; });
  R.Bpool = R.bones.map(()=>({x:0,y:0,a:0}));
  R.Bmap  = {}; R.bones.forEach((b,i)=>{ R.Bmap[b.n]=R.Bpool[i]; });
  R.Ao = {_x:0,_y:0};
  R.bones.forEach(b=>{ R.Ao[b.n]=0; });
  R.akeys = Object.keys(R.Ao);
  R.pcache = new Map();
}
const RIG_FOR = {blob:'blob', beast:'quad', spike:'arach', ghost:'wraith', golem:'golem',
                 flyer:'flyer', worm:'worm', eye:'eye', knight:'human'};

/* ---------- rig evaluation (allocation-free per frame) ---------- */
function poseRig(rig, st){
  const A = rig.Ao, ks = rig.akeys;
  for(let i=0;i<ks.length;i++) A[ks[i]] = 0;
  st._sx=1; st._sy=1; st.A=A;
  rig.pose(A, st);
  return A;
}
function solveRig(rig, A, r){
  const bones = rig.bones, pool = rig.Bpool;
  for(let i=0;i<bones.length;i++){
    const b = bones[i];
    let px=0, py=0, pa=0;
    if(b.pi>=0){ const par=pool[b.pi]; px=par.x; py=par.y; pa=par.a; }
    const ca=Math.cos(pa), sa=Math.sin(pa);
    const ox=b.ox*r, oy=b.oy*r, t=pool[i];
    t.x = px + ox*ca - oy*sa;
    t.y = py + ox*sa + oy*ca;
    t.a = pa + b.ang + A[b.n];
  }
  return rig.Bmap;
}
/* One key build + Map lookup per ENTITY rather than per bone.
   (A packed atlas was tried here and measured SLOWER — rebuilding a whole
   atlas whenever an entity size or flash palette appeared cost more than the
   texture binds it saved.) */
function partsFor(rig, pal, r){
  const ri = Math.round(r);
  const key = pal.key+'|'+ri;
  let arr = rig.pcache.get(key);
  if(arr) return arr;
  if(rig.pcache.size > 60) rig.pcache.clear();
  arr = rig.draw.map(b => bakePart(b.shape||'capsule', b.len*ri, b.w*ri, pal, b.role, b.taper));
  rig.pcache.set(key, arr);
  return arr;
}
/* Composes the entity matrix with each bone transform by hand and issues a
   single setTransform+drawImage per part — no canvas save/restore churn. */
function drawRigParts(rig, B, pal, r, M){
  const parts = partsFor(rig, pal, r);
  const dl = rig.draw, pool = rig.Bpool;
  const Ma=M.a, Mb=M.b, Mc=M.c, Md=M.d, Me=M.e, Mf=M.f;
  for(let i=0;i<dl.length;i++){
    const b = dl[i], t = pool[b.i], p = parts[i];
    const bc = Math.cos(t.a), bs = Math.sin(t.a);
    let le = t.x, lf = t.y;
    if(b.dx||b.dy){
      const dx=(b.dx||0)*r, dy=(b.dy||0)*r;
      le += dx*bc - dy*bs; lf += dx*bs + dy*bc;
    }
    ctx.setTransform(
      Ma*bc + Mc*bs,  Mb*bc + Md*bs,
      Ma*-bs + Mc*bc, Mb*-bs + Md*bc,
      Ma*le + Mc*lf + Me, Mb*le + Md*lf + Mf);
    ctx.drawImage(p.cv, -p.ox, -p.oy);
  }
  ctx.setTransform(Ma,Mb,Mc,Md,Me,Mf);
}

/* ---------- eyes & glows ---------- */
function eyeDots(B, bone, r, st, cfg){
  const t = B[bone]; if(!t) return;
  const ca=Math.cos(t.a), sa=Math.sin(t.a);
  const col = cfg.col, rad = cfg.r*r, sep = cfg.sep*r, fwd = cfg.fwd*r;
  for(const sgn of (cfg.one?[0]:[-1,1])){
    const lx = fwd, ly = sgn*sep;
    const x = t.x + lx*ca - ly*sa, y = t.y + lx*sa + ly*ca;
    drawGlow(x,y,col,rad*3.4,0.55);
    ctx.fillStyle=col; ctx.beginPath(); ctx.arc(x,y,rad,0,6.283); ctx.fill();
    ctx.fillStyle='#ffffff'; ctx.globalAlpha=0.75;
    ctx.beginPath(); ctx.arc(x-rad*0.3,y-rad*0.3,rad*0.34,0,6.283); ctx.fill();
    ctx.globalAlpha=1;
  }
}

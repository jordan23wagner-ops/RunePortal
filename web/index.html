/* ---------- soft contact shadow ---------- */
let shadowSprite=null;
function getShadow(){
  if(shadowSprite) return shadowSprite;
  const s=64, c=document.createElement('canvas'); c.width=c.height=s;
  const g=c.getContext('2d');
  const gr=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  gr.addColorStop(0,'rgba(0,0,0,0.55)');
  gr.addColorStop(0.5,'rgba(0,0,0,0.26)');
  gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gr; g.fillRect(0,0,s,s);
  shadowSprite=c; return c;
}
function drawShadow(x,y,rx,ry,a){
  ctx.globalAlpha=a;
  ctx.drawImage(getShadow(), x-rx, y-ry, rx*2, ry*2);
  ctx.globalAlpha=1;
}

/* ---------- weapon in hand ---------- */
function drawWeapon(B,r,st){
  const f = B.foreN; if(!f || !st.wpn) return;
  const L = 0.42*r;
  const hx = f.x+Math.cos(f.a)*L, hy = f.y+Math.sin(f.a)*L;
  const steel = paletteFor('#d2dbec','#69768f');
  const wood  = paletteFor('#8c6b45','#48331e');
  const gold  = paletteFor('#e8c46a','#8a6a1e');
  const blit=(pal,shape,len,w,role,taper,ox,oy,rot)=>{
    const p=bakePart(shape,len,w,pal,role,taper);
    ctx.save(); ctx.translate(ox||0,oy||0); if(rot) ctx.rotate(rot);
    ctx.drawImage(p.cv,-p.ox,-p.oy); ctx.restore();
  };
  ctx.save(); ctx.translate(hx,hy); ctx.rotate(f.a);
  const k = st.wpn;

  if(k==='bow'){
    ctx.rotate(1.5708);
    ctx.lineCap='round';
    ctx.strokeStyle='#3a2716'; ctx.lineWidth=r*0.135;
    ctx.beginPath(); ctx.arc(-r*0.30,0,r*0.92,-1.02,1.02); ctx.stroke();
    ctx.strokeStyle='#8c6b45'; ctx.lineWidth=r*0.085;
    ctx.beginPath(); ctx.arc(-r*0.30,0,r*0.92,-1.02,1.02); ctx.stroke();
    ctx.strokeStyle='#e4dcc4'; ctx.lineWidth=r*0.032;
    const bx=-r*0.30+Math.cos(1.02)*r*0.92, by=Math.sin(1.02)*r*0.92;
    ctx.beginPath(); ctx.moveTo(bx,-by); ctx.lineTo(r*0.04*(1+st.draw||0),0); ctx.lineTo(bx,by); ctx.stroke();
  } else if(k==='crossbow'){
    blit(wood,'capsule',r*0.95,r*0.17,'mid',0.8,-r*0.2,0);
    blit(steel,'capsule',r*0.90,r*0.09,'lite',0.6,r*0.15,-r*0.02,1.5708);
    blit(steel,'capsule',r*0.90,r*0.09,'lite',0.6,r*0.15,-r*0.02,-1.5708);
  } else if(k==='axe'){
    blit(wood,'capsule',r*1.25,r*0.11,'mid',0.9,-r*0.12,0);
    blit(steel,'tri',r*0.52,r*0.66,'lite',1,r*0.98,-r*0.30,0.5);
  } else if(k==='mace'){
    blit(wood,'capsule',r*1.05,r*0.12,'mid',0.9,-r*0.12,0);
    blit(steel,'orb',r*0.46,r*0.46,'lite',1,r*0.92,-r*0.23);
  } else if(k==='staff'){
    blit(wood,'capsule',r*1.85,r*0.11,'mid',0.85,-r*0.55,0);
    const gcol = st.accent||'#8ab4ff';
    drawGlow(r*1.32,0,gcol,r*0.60,0.75);
    ctx.fillStyle=gcol; ctx.beginPath(); ctx.arc(r*1.32,0,r*0.20,0,6.283); ctx.fill();
    ctx.fillStyle='#ffffff'; ctx.globalAlpha=0.7;
    ctx.beginPath(); ctx.arc(r*1.26,-r*0.06,r*0.07,0,6.283); ctx.fill(); ctx.globalAlpha=1;
  } else if(k==='tome'){
    blit(paletteFor('#a83a4a','#5a1420'),'capsule',r*0.52,r*0.62,'mid',1,-r*0.05,-r*0.31,0);
    const gcol = st.accent||'#8ab4ff';
    drawGlow(r*0.70,0,gcol,r*0.55,0.6);
  } else if(k==='orb'){
    const gcol = st.accent||'#c084fc';
    drawGlow(r*0.85,0,gcol,r*0.85,0.8);
    ctx.fillStyle=gcol; ctx.beginPath(); ctx.arc(r*0.85,0,r*0.30,0,6.283); ctx.fill();
    ctx.strokeStyle='#ffffff'; ctx.globalAlpha=0.5; ctx.lineWidth=r*0.03;
    ctx.beginPath(); ctx.arc(r*0.85,0,r*0.30,0,6.283); ctx.stroke(); ctx.globalAlpha=1;
  } else if(k==='gun'){
    blit(wood,'capsule',r*0.65,r*0.20,'mid',0.7,-r*0.1,0);
    blit(steel,'capsule',r*0.95,r*0.15,'dark',0.9,r*0.5,-r*0.04);
  } else {
    /* blade family: dagger / sword / greatsword / spear */
    const len = k==='dagger'? r*0.85 : k==='great'? r*2.05 : k==='spear'? r*2.35 : r*1.45;
    const wid = k==='great'? r*0.30 : k==='spear'? r*0.16 : r*0.20;
    if(k==='spear'){
      blit(wood,'capsule',len*0.82,r*0.10,'mid',0.95,0,0);
      blit(steel,'blade',r*0.52,r*0.26,'lite',1,len*0.80,0);
    } else {
      blit(steel,'blade',len,wid,'lite',1,r*0.16,0);
      blit(gold,'capsule',r*0.46,r*0.13,'mid',1,r*0.12,-r*0.23,1.5708);   /* crossguard */
      blit(wood,'capsule',r*0.30,r*0.12,'mid',0.9,-r*0.22,0);             /* grip */
    }
  }
  ctx.restore();
}
function wpnKindFor(arch){
  const m = {sword:'sword',dagger:'dagger',greatsword:'great',spear:'spear',axe:'axe',mace:'mace',
    shortbow:'bow',longbow:'bow',crossbow:'crossbow',knives:'dagger',handcannon:'gun',
    firestaff:'staff',icewand:'staff',stormrod:'staff',voidtome:'tome',arcaneorb:'orb'};
  return m[arch] || 'sword';
}

/* ---------- shared animation state ---------- */
const ATK_DUR = 0.42;
const GFX = {parts:1, detail:1, shadow:1, glow:1, backdrop:1, weapon:1};
const _ST = {};
function baseState(an, time){
  _ST.time=time; _ST.ph=an.ph; _ST.walk=an.walk; _ST.atk=an.atk; _ST.hurt=an.hurt;
  _ST.flip=an.flip; _ST.rot=0; _ST.cls='melee'; _ST.wpn=null; _ST.accent=null;
  _ST.lookX=1; _ST.lookY=0; _ST.draw=0;

function newAnim(){ return {ph:rnd(0,6.283), walk:0, atk:-1, hurt:0, flip:1, px:0, py:0}; }
function stepAnim(an, e, dt, moved){
  an.ph += moved*0.055;
  const target = clamp(moved/dt/46, 0, 1);
  an.walk += (target-an.walk)*Math.min(1, dt*9);
  if(an.atk>=0){ an.atk += dt/ATK_DUR; if(an.atk>1) an.atk=-1; }
  an.hurt = Math.max(0, an.hurt - dt*5.2);
}

/* ---------- character draw ---------- */
function drawChar(rigName, pal, x, y, r, st, alpha){
  const rig = RIGS[rigName] || RIGS.human;
  const rr = r*rig.sc;
  const A = poseRig(rig, st);
  const B = solveRig(rig, A, rr);
  const gy = y + rr*rig.footPx, sw = rr*rig.halfW;
  if(GFX.shadow){
    if(!rig.ghost) drawShadow(x, gy, sw*0.92, sw*0.30, (alpha==null?1:alpha)*0.8);
    else           drawShadow(x, gy+rr*0.18, sw*0.62, sw*0.20, (alpha==null?1:alpha)*0.35);
  }
  ctx.save();
  ctx.translate(x + (A._x||0)*rr, y + (A._y||0)*rr);
  if(st.rot) ctx.rotate(st.rot);
  ctx.scale(st.flip*(st._sx||1), (st._sy||1));
  if(alpha!=null && alpha<1) ctx.globalAlpha = alpha;
  if(GFX.parts) drawRigParts(rig, B, pal, rr, ctx.getTransform());
  const d = DETAIL[rigName]; if(d && GFX.detail) d(B, pal, rr, st);
  if(st.wpn && GFX.weapon) drawWeapon(B, rr, st);
  ctx.restore();
  ctx.globalAlpha = 1;
}

/* ---------- enemies ---------- */
function drawFoe(f){
  const def = f.def;
  const rigName = RIG_FOR[def.shape] || 'human';
  const rig = RIGS[rigName];
  const warpT = f.warp||0.42;
  let alpha = 1, scale = 1;
  if(f.born < warpT){
    const k = f.born/warpT;
    alpha = 0.30+k*0.70; scale = 0.40+k*0.60;
    ctx.save();
    ctx.globalAlpha=(1-k)*0.8; ctx.strokeStyle=def.col; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.arc(f.x,f.y,f.r*(0.85+(1-k)*0.75),0,6.283); ctx.stroke();
    ctx.restore(); ctx.globalAlpha=1;
  }
  const pal = f.flash>0 ? paletteFor('#ffffff','#d8d8e8') : paletteFor(def.col, def.col2);
  const st = baseState(f.an, f.t);
  st.accent = def.shape==='golem' ? '#ff9a4c'
            : def.shape==='eye'   ? def.col
            : shade(def.col, 0.5);
  if(def.shape==='eye'){
    const dx=P.x-f.x, dy=P.y-f.y, d=Math.hypot(dx,dy)||1;
    st.lookX = (dx/d)*f.an.flip; st.lookY = dy/d;
  }
  if(f.rank) drawGlow(f.x, f.y, def.col, f.r*2.2, f.rank===2?0.40:0.26);
  if(f.tele){
    ctx.strokeStyle='#ff5a3c'; ctx.lineWidth=2.4;
    ctx.globalAlpha=0.45+Math.sin(f.t*22)*0.30;
    ctx.beginPath(); ctx.arc(f.x,f.y,f.r+8,0,6.283); ctx.stroke(); ctx.globalAlpha=1;
  }
  st._sx = 1; st._sy = 1;
  drawChar(rigName, pal, f.x, f.y, f.r*scale, st, alpha);

  if(f.slowA>0) drawGlow(f.x,f.y,'#8fd8ff',f.r*1.5,0.22);
  if(f.burn>0) drawGlow(f.x,f.y,'#ff8a3c',f.r*1.3,0.20);
  if(f.pois>0) drawGlow(f.x,f.y,'#a3e635',f.r*1.3,0.18);

  if(f.hp < f.max*0.999 && f!==bossRef && f.born>=warpT){
    const rg = RIGS[rigName], rr = f.r*rg.sc;
    const w = clamp(rr*rg.halfW*0.95, 15, 42), hpct = clamp(f.hp/f.max,0,1);
    const by = f.y + rr*rg.topPx - 6;
    ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(f.x-w/2, by, w, 3);
    ctx.fillStyle = f.rank? '#ff9a4c':'#e0455a';
    ctx.fillRect(f.x-w/2, by, w*hpct, 3);
  }
}

/* ---------- corpses: enemies collapse instead of vanishing ---------- */
let corpses = [];
const _zList = [];
function drawCorpse(c){
  const rigName = RIG_FOR[c.def.shape] || 'human';
  const k = clamp(c.t/0.75, 0, 1);
  const e = k*k*(3-2*k);
  const st = baseState(c.an, c.time);
  st.walk=0; st.atk=-1; st.hurt=0;
  st.rot = e*1.35*c.an.flip;
  st._sx=1; st._sy=1;
  st.accent = shade(c.def.col, 0.4);
  drawChar(rigName, paletteFor(shade(c.def.col,-0.25), shade(c.def.col2,-0.3)),
    c.x, c.y + e*c.r*0.35, c.r*(1-e*0.10), st, 1-Math.max(0,(k-0.55)/0.45));
}

/* ---------- player ---------- */
function drawPlayer(){
  const cls = D.wpnCls;
  const col = cls==='melee'?'#f0955a':cls==='range'?'#6ee7a8':'#8ab4ff';
  const st = baseState(P.an, P.t||0);
  st.cls = cls;
  st.wpn = S.equip.weapon ? wpnKindFor(S.equip.weapon.arch) : 'sword';
  st.accent = col;
  st._sx=1; st._sy=1;

  /* standing ring keeps you findable when a pack closes over you */
  ctx.strokeStyle=col; ctx.globalAlpha=0.45; ctx.lineWidth=1.6;
  ctx.beginPath(); ctx.ellipse(P.x,P.y+P.r*1.02,P.r*1.15,P.r*0.40,0,0,6.283); ctx.stroke();
  ctx.globalAlpha=1;
  drawGlow(P.x,P.y,col,P.r*2.0,P.inv>0?0.55:0.26);

  drawChar('human', PLAYER_PAL(cls, P.flash>0), P.x, P.y, P.r,
    st, P.inv>0 ? (0.5+Math.sin(performance.now()/45)*0.28) : 1);

  if(P.bulwark>0){
    ctx.strokeStyle='#8fd8ff'; ctx.globalAlpha=0.18+P.bulwark*0.13; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(P.x,P.y,P.r*1.9,0,6.283); ctx.stroke(); ctx.globalAlpha=1;
  }
}
/* Measure every rig's true ground line and half-width from its idle pose, so
   shadows sit under the feet and scale with the creature instead of being
   hand-tuned per rig (and re-tuned every time proportions change). */
(function measureRigs(){
  for(const k in RIGS){
    const R = RIGS[k];
    const an = {ph:0, walk:0, atk:-1, hurt:0, flip:1};
    const st = baseState(an, 0.8); st._sx=1; st._sy=1;
    const A = poseRig(R, st), B = solveRig(R, A, 100);
    let maxY=-1e9, minY=1e9, maxX=0;
    for(const b of R.bones){
      const t=B[b.n]; if(!t) continue;
      const hw = b.w*50;
      for(const e of [0, b.len*100]){
        const px = t.x+Math.cos(t.a)*e + (b.dx||0)*100;
        const py = t.y+Math.sin(t.a)*e + (b.dy||0)*100;
        maxY = Math.max(maxY, py+hw);
        minY = Math.min(minY, py-hw);
        maxX = Math.max(maxX, Math.abs(px)+hw);
      }
    }
    R.footPx = maxY/100;
    R.topPx  = minY/100;
    R.halfW  = maxX/100;
  }
})();

function PLAYER_PAL(cls, hit){
  if(hit) return paletteFor('#ffffff','#c8ccd8');
  if(cls==='melee') return paletteFor('#b9c6de','#5a6478');
  if(cls==='range') return paletteFor('#a8cdb4','#4e6a58');
  return paletteFor('#aeb8e4','#545c86');
}

function render(){
  const z = ZONE_BY_ID[S.zone];
  ctx.save();
  if(shake>0.2) ctx.translate(rnd(-shake,shake)*0.5, rnd(-shake,shake)*0.5);

  if(backdrop && GFX.backdrop) ctx.drawImage(backdrop,0,0,W,H);
  else { ctx.fillStyle=z.sky2; ctx.fillRect(0,0,W,H); }

  /* drifting motes */
  const now = performance.now()/1000;
  ctx.fillStyle = z.accent;
  for(const m of bdMotes){
    const yy = (m.y - now*m.s) % H; const ny = yy<0? yy+H : yy;
    ctx.globalAlpha = m.a*0.55;
    ctx.beginPath(); ctx.arc(m.x, ny, m.r, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha=1;

  /* fx rings + bolts (under entities) */
  for(const e of fx){
    const k = e.t/e.life;
    if(e.type==='bolt'){
      ctx.globalAlpha = 1-k; ctx.strokeStyle=e.col; ctx.lineWidth=2.6;
      ctx.beginPath(); ctx.moveTo(e.x1,e.y1);
      const mx=(e.x1+e.x2)/2+rnd(-12,12), my=(e.y1+e.y2)/2+rnd(-12,12);
      ctx.lineTo(mx,my); ctx.lineTo(e.x2,e.y2); ctx.stroke(); ctx.globalAlpha=1;
    } else if(e.type!=='arc'){
      ctx.globalAlpha = (1-k)*0.85; ctx.strokeStyle=e.col; ctx.lineWidth=3*(1-k)+1;
      ctx.beginPath(); ctx.arc(e.x,e.y, lerp(e.r,e.r1,k), 0, 6.283); ctx.stroke(); ctx.globalAlpha=1;
    }
  }

  /* drops */
  for(const d of drops){
    const a = clamp(1-(d.life-0.6)/0.5,0,1);
    ctx.globalAlpha=a;
    if(d.t==='gold'){
      ctx.fillStyle='#e8b44a'; ctx.beginPath(); ctx.arc(d.x,d.y,4.5,0,6.283); ctx.fill();
      ctx.fillStyle='#fff3c4'; ctx.beginPath(); ctx.arc(d.x-1.3,d.y-1.3,1.6,0,6.283); ctx.fill();
    } else if(d.t==='mat'){
      ctx.font='14px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(MATS[d.k].ic, d.x, d.y);
    } else {
      const c=RARITY[d.it.rar].col;
      drawGlow(d.x,d.y,c,16,0.7*a);
      ctx.fillStyle=c; ctx.save(); ctx.translate(d.x,d.y); ctx.rotate(0.785);
      ctx.fillRect(-4.5,-4.5,9,9); ctx.restore();
    }
    ctx.globalAlpha=1;
  }

  /* chest */
  if(chest){
    const b = Math.sin(chest.t*3)*2;
    drawGlow(chest.x,chest.y+b,'#e8b44a',34,0.4+Math.sin(chest.t*3)*0.1);
    ctx.fillStyle='#7a5a24'; ctx.fillRect(chest.x-15,chest.y-8+b,30,18);
    ctx.fillStyle='#a8762c';
    ctx.beginPath(); ctx.ellipse(chest.x,chest.y-8+b,15,9,0,Math.PI,0); ctx.fill();
    ctx.fillStyle='#e8b44a'; ctx.fillRect(chest.x-3,chest.y-6+b,6,10);
    ctx.strokeStyle='#4a3512'; ctx.lineWidth=1.6; ctx.strokeRect(chest.x-15,chest.y-8+b,30,18);
  }

  /* depth-sorted characters: whoever stands lower on screen draws in front */
  _zList.length = 0;
  for(const c of corpses) _zList.push(c);
  for(const f of foes)    _zList.push(f);
  _zList.sort((a,b)=> (a.y+(a.r||0)) - (b.y+(b.r||0)));
  for(const e of _zList) e.corpse ? drawCorpse(e) : drawFoe(e);
  /* Hero always draws last. Depth-sorting him too is more "correct", but on a
     phone a pack closing in buries the one thing you must never lose track of. */
  if(!P.dead) drawPlayer();

  /* melee arcs (over player) */
  for(const e of fx){
    if(e.type!=='arc') continue;
    const k=e.t/e.life;
    ctx.globalAlpha=(1-k)*0.9; ctx.strokeStyle=e.col; ctx.lineWidth=5*(1-k)+2;
    ctx.beginPath();
    ctx.arc(e.x,e.y, e.rng*lerp(0.55,1,k), e.ang-e.arc/2, e.ang+e.arc/2);
    ctx.stroke(); ctx.globalAlpha=1;
  }

  /* projectiles */
  for(const s of shots){
    drawGlow(s.x,s.y,s.col,s.r*2.6,0.5);
    ctx.fillStyle=s.col; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.283); ctx.fill();
    if(s.own==='p'){
      ctx.strokeStyle=s.col; ctx.globalAlpha=0.4; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(s.x,s.y);
      ctx.lineTo(s.x-s.vx*0.022,s.y-s.vy*0.022); ctx.stroke(); ctx.globalAlpha=1;
    }
  }

  /* particles */
  for(const p of parts){
    ctx.globalAlpha = clamp(p.life/p.max,0,1);
    ctx.fillStyle=p.col;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.283); ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.restore();
}

/* ================================================================
   MAIN LOOP
   ================================================================ */
let lastT=0, _fAcc=0, _fN=0, _downgrades=0;
function loop(ts){
  requestAnimationFrame(loop);
  if(!running) return;
  const dt = Math.min(0.05, (ts-lastT)/1000 || 0.016);
  lastT = ts;
  if(!paused){
    update(dt);
    _fAcc += dt; _fN++;
    if(_fN >= 150){
      const avg = _fAcc/_fN; _fAcc=0; _fN=0;
      if(avg > 0.026 && _downgrades < 2){
        _downgrades++;
        applyGfx(gfxTier==='high' ? 'med' : 'low');
        toast('Graphics lowered for smoother play');
      }
    }
  }
  render();
}

/* ================================================================
   UI HELPERS
   ================================================================ */
function affStr(a){
  const A = AFFIX_MAP[a.k]; if(!A) return '';
  const v = A.fl ? a.v.toFixed(1) : Math.round(a.v);
  return '+'+v+(A.pct?'%':'')+(A.sfx||'')+' '+A.n;
}
function itemDps(it){
  if(it.kind!=='weapon') return 0;
  const A = WEAPONS[it.arch]||UNARMED;
  const pb = 1+it.plus*0.06;
  return ((it.dmin+it.dmax)/2)*pb*A.spd;
}
function itemSub(it){
  if(it.kind==='weapon'){
    const A=WEAPONS[it.arch]||UNARMED;
    return A.n+' · '+A.cls.toUpperCase()+(A.two?' · 2H':'');
  }
  if(it.kind==='offhand') return (OFFHANDS[it.arch]||{n:'Offhand'}).n+' · OFFHAND';
  if(it.kind==='trinket') return (TRINKETS[it.arch]||{n:'Trinket'}).n.toUpperCase();
  return SLOT_LABEL[it.slot]+' · '+(ARMOR_LINES[it.arch]?ARMOR_LINES[it.arch].n:'');
}
function itemStatLine(it){
  if(it.kind==='weapon'){
    const pb=1+it.plus*0.06;
    return '<b>'+Math.round(it.dmin*pb)+'–'+Math.round(it.dmax*pb)+'</b> dmg';
  }
  if(it.armor) return '<b>'+Math.round(it.armor*(1+it.plus*0.06))+'</b> armor';
  return '<span style="color:var(--dim2)">trinket</span>';
}
function itemCard(it, opts){
  opts = opts||{};
  const eq = opts.equipped;
  const glow = it.rar>=3 ? ' glow'+it.rar : '';
  let tags='';
  if(eq) tags+='<span class="tagEq">EQUIPPED</span>';
  else if(it.new) tags+='<span class="tagNew">NEW</span>';
  const affs = it.affixes.slice(0,2).map(a=>'<span class="aff">'+affStr(a)+'</span>').join('');
  const more = it.affixes.length>2 ? '<span class="aff" style="color:var(--dim2)">+'+(it.affixes.length-2)+' more</span>':'';
  const uni = it.uniq ? '<span class="aff uni">◆ '+it.uniq.n+'</span>' : '';
  return '<div class="card rar'+it.rar+glow+'" data-uid="'+it.uid+'">'+
    '<div class="cIcon">'+it.ic+'</div>'+
    '<div class="cMid">'+
      '<div class="cName">'+it.name+(it.plus?' <span class="plus">+'+it.plus+'</span>':'')+'</div>'+
      '<div class="cMeta">'+itemSub(it)+'</div>'+
      '<div class="cStat">'+itemStatLine(it)+'</div>'+
      '<div class="affList">'+uni+affs+more+'</div>'+
    '</div>'+
    '<div class="cRight">'+tags+
      '<span class="ilvl">iLvl '+it.ilvl+'</span>'+
      (it.kind==='weapon'&&it.quality!=null ?
        '<div class="rollBar" title="roll quality"><i style="width:'+Math.round(it.quality*100)+'%"></i></div>'+
        '<span class="ilvl">'+Math.round(it.quality*100)+'% roll</span>' : '')+
    '</div>'+
  '</div>';
}
function findItem(uid){
  uid = +uid;
  for(const k of SLOT_ORDER){ const i=S.equip[k]; if(i&&i.uid===uid) return {it:i,where:k}; }
  const idx = S.bag.findIndex(i=>i.uid===uid);
  if(idx>=0) return {it:S.bag[idx], where:'bag', idx};
  return null;
}

/* ================================================================
   EQUIP
   ================================================================ */
function bagRoom(n){ return S.bag.length + (n||1) <= TUNE.bagMax; }
function equipItem(uid){
  const f = findItem(uid); if(!f || f.where!=='bag') return;
  const it = f.it;
  let slot = it.slot;
  if(slot==='ring') slot = S.equip.ring1 ? (S.equip.ring2 ? 'ring1':'ring2') : 'ring1';

  const outs = [];
  if(slot==='weapon'){
    const two = WEAPONS[it.arch] && WEAPONS[it.arch].two;
    if(two && S.equip.offhand){ outs.push(S.equip.offhand); S.equip.offhand=null; }
  }
  if(slot==='offhand'){
    const w = S.equip.weapon;
    if(w && WEAPONS[w.arch] && WEAPONS[w.arch].two){ outs.push(w); S.equip.weapon=null; }
  }
  if(S.equip[slot]) outs.push(S.equip[slot]);

  if(S.bag.length - 1 + outs.length > TUNE.bagMax){ toast('Backpack too full to swap'); sfx('no'); return; }
  S.bag.splice(S.bag.indexOf(it),1);
  delete it.new;
  S.equip[slot] = it;
  for(const o of outs) S.bag.push(o);
  computeStats();
  P.hp = Math.min(P.hp, D.maxHp); P.mp = Math.min(P.mp, D.maxMp);
  sfx('buy'); buzz(14);
  closeModal(); renderBag(); renderGear(); saveGame();
  toast('Equipped '+it.name);
}
function unequipItem(slot){
  const it = S.equip[slot]; if(!it) return;
  if(!bagRoom(1)){ toast('Backpack full'); sfx('no'); return; }
  S.equip[slot]=null; S.bag.push(it);
  computeStats(); P.hp=Math.min(P.hp,D.maxHp);
  closeModal(); renderBag(); renderGear(); saveGame();
}
function salvageUid(uid){
  const f = findItem(uid);
  if(!f) return;
  if(f.where!=='bag'){ toast('Unequip it first'); sfx('no'); return; }
  const y = salvage(f.it);
  S.bag.splice(S.bag.indexOf(f.it),1);
  const parts = Object.keys(y).map(k=> k==='gold'? y.gold+'g' : y[k]+'× '+MATS[k].n);
  toast('Salvaged → '+parts.join(', '));
  sfx('salv'); buzz(12);
  closeModal(); renderBag(); saveGame();
}

function compareHtml(it){
  if(it.kind==='weapon'){
    const cur = S.equip.weapon;
    const a = itemDps(it), b = cur? itemDps(cur):0;
    if(!cur) return '<span class="cmp better">EMPTY SLOT</span>';
    const d = a-b, pct = b? Math.round(d/b*100):100;
    return '<span class="cmp '+(d>=0?'better':'worse')+'">'+(d>=0?'+':'')+pct+'% DPS vs equipped</span>';
  }
  if(it.kind==='trinket'){
    const slot = it.slot==='ring'?'ring1':it.slot;
    const cur = S.equip[slot];
    if(!cur) return '<span class="cmp better">EMPTY SLOT</span>';
    /* no single headline stat on a trinket — score roll quality, tier and ilvl */
    const score = x => x.affixes.reduce((a,f)=>a+f.roll,0) + x.rar*0.5 + x.ilvl*0.04;
    const d = score(it)-score(cur);
    return '<span class="cmp '+(d>=0?'better':'worse')+'">'+
      (d>=0?'stronger':'weaker')+' than equipped</span>';
  }
  if(it.armor){
    const slot = it.slot==='ring'?'ring1':it.slot;
    const cur = S.equip[slot];
    const a = it.armor*(1+it.plus*0.06), b = cur&&cur.armor? cur.armor*(1+cur.plus*0.06):0;
    const d = Math.round(a-b);
    return '<span class="cmp '+(d>=0?'better':'worse')+'">'+(d>=0?'+':'')+d+' armor vs equipped</span>';
  }
  return '';
}
function openItemModal(uid){
  const f = findItem(uid); if(!f) return;
  const it = f.it; modalUid = it.uid;
  delete it.new;
  const R = RARITY[it.rar];
  const A = it.kind==='weapon' ? (WEAPONS[it.arch]||UNARMED) : null;
  const pb = 1+it.plus*0.06;

  let h = '<div class="detHead rar'+it.rar+'">'+
    '<div class="detIc">'+it.ic+'</div>'+
    '<div><div class="detName">'+it.name+(it.plus?' +'+it.plus:'')+'</div>'+
    '<div class="detSub">'+R.name+' · '+itemSub(it)+' · iLvl '+it.ilvl+'</div>'+
    '<div style="margin-top:5px;">'+compareHtml(it)+'</div></div></div>';

  let blk = '';
  if(A){
    blk += '<div class="dRow"><span class="dk">Damage</span><span class="dv">'+
      Math.round(it.dmin*pb)+' – '+Math.round(it.dmax*pb)+'</span></div>';
    blk += '<div class="dRow"><span class="dk">Attack Speed</span><span class="dv">'+A.spd.toFixed(2)+'/s</span></div>';
    blk += '<div class="dRow"><span class="dk">Weapon DPS</span><span class="dv">'+Math.round(itemDps(it))+'</span></div>';
    blk += '<div class="dRow"><span class="dk">Scales With</span><span class="dv">'+
      STATS.find(s=>s.k===A.stat).n+'</span></div>';
    blk += '<div class="dRow"><span class="dk">Range</span><span class="dv">'+A.rng+'</span></div>';
    if(it.quality!=null) blk += '<div class="rollMeter"><div class="rl"><span>Damage Roll</span><span>'+
      Math.round(it.quality*100)+'%</span></div><div class="rollTrack rar'+it.rar+
      '"><i style="width:'+Math.round(it.quality*100)+'%"></i></div></div>';
    blk += '<div class="dRow" style="margin-top:8px;"><span class="dk" style="font-size:11px;font-style:italic;">'+A.note+'</span></div>';
  }
  if(it.armor) blk += '<div class="dRow"><span class="dk">Armor</span><span class="dv">'+Math.round(it.armor*pb)+'</span></div>';
  if(it.kind==='offhand' && OFFHANDS[it.arch])
    blk += '<div class="dRow"><span class="dk" style="font-size:11px;font-style:italic;">'+OFFHANDS[it.arch].note+'</span></div>';
  if(it.kind==='trinket')
    blk += '<div class="dRow"><span class="dk" style="font-size:11px;font-style:italic;">'+
      'Trinkets carry no armour — they roll an extra bonus affix instead.</span></div>';
  /* only wrap when there is something to show, or trinkets render an empty bar */
  if(blk) h += '<div class="detBlock">'+blk+'</div>';

  if(it.uniq){
    h += '<div class="detBlock rar5" style="border-color:rgba(244,63,94,.45);">'+
      '<div class="dRow"><span class="dk" style="color:var(--r5);font-weight:800;letter-spacing:1px;">◆ '+
      it.uniq.n+'</span></div><div style="font-size:11.5px;color:var(--txt);line-height:1.55;">'+
      it.uniq.d+'</div></div>';
  }
  if(it.affixes.length){
    h += '<div class="detBlock">';
    for(const a of it.affixes){
      h += '<div class="dRow"><span class="dk">'+affStr(a)+'</span>'+
        '<span class="dv" style="font-size:10px;color:var(--dim2)">'+Math.round(a.roll*100)+'% roll</span></div>';
    }
    h += '</div>';
  }
  if(it.flavor) h += '<div class="detFlavor rar'+it.rar+'">'+it.flavor+'</div>';

  /* salvage preview */
  if(f.where==='bag'){
    const y = salvageYield(it);
    h += '<div class="costRow" style="margin-bottom:10px;">'+
      Object.keys(y).map(k=>'<span class="cost">'+(k==='gold'? y.gold+'g' :
        MATS[k].ic+' '+y[k]+'× '+MATS[k].n)+'</span>').join('')+'</div>';
  }

  h += '<div class="modalBtns">';
  if(f.where==='bag'){
    h += '<button class="btn pri wide" data-act="equip">Equip</button>'+
         '<button class="btn dan" data-act="salv">Salvage</button>';
  } else {
    h += '<button class="btn wide" data-act="unequip" data-slot="'+f.where+'">Unequip</button>';
  }
  h += '<button class="btn gho" data-act="close">Close</button></div>';

  $('modalBody').innerHTML = h;
  $('modalWrap').classList.add('open');
}
$('modalBody').addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if(!b) return;
  const act = b.dataset.act;
  if(act==='equip')    equipItem(modalUid);
  if(act==='salv')     salvageUid(modalUid);
  if(act==='unequip')  unequipItem(b.dataset.slot);
  if(act==='close')    closeModal();
  if(act==='upgrade')  doUpgrade(+b.dataset.uid);
  if(act==='craft')    doCraft(b.dataset.rid);
  if(act==='buy')      doBuy(b.dataset.sid);
  if(act==='bulkSalv') doBulkSalvage(+b.dataset.r);
});

/* ================================================================
   BACKPACK PANEL
   ================================================================ */
let bagFilter='all';
function bagCell(it){
  const glow = it.rar>=3 ? ' g'+it.rar : '';
  return '<div class="gcell rar'+it.rar+glow+'" data-uid="'+it.uid+'">'+
    it.ic+
    '<span class="gl">'+it.ilvl+'</span>'+
    (it.plus?'<span class="gp">+'+it.plus+'</span>':'')+
    (it.new?'<span class="gn"></span>':'')+
  '</div>';
}
function renderBag(){
  const grid = $('bagGrid');
  let items = S.bag.slice();
  if(bagFilter!=='all') items = items.filter(i=>{
    if(bagFilter==='weapon') return i.kind==='weapon';
    if(bagFilter==='armor')  return i.kind==='armor';
    return i.kind==='trinket'||i.kind==='offhand';
  });
  $('bagCount').textContent = S.bag.length+'/'+TUNE.bagMax;
  $('bagCount').classList.toggle('full', S.bag.length>=TUNE.bagMax);
  $('bagSub').textContent = S.bag.length+' items · '+fmt(S.gold)+' gold';
  if(!items.length){
    grid.innerHTML = '<div class="empty" style="grid-column:1/-1;">Nothing here yet.<br>'+
      'Kill things. Open chests.<br>The rift is generous to the persistent.</div>';
    return;
  }
  /* pad out to full capacity so the grid reads as a real pack, not a list */
  const pad = bagFilter==='all' ? TUNE.bagMax - items.length : 0;
  grid.innerHTML = items.map(bagCell).join('') +
    '<div class="gcell slotEmpty"></div>'.repeat(Math.max(0,pad));
}
$('bagGrid').addEventListener('click', e=>{
  const c = e.target.closest('.gcell'); if(c && c.dataset.uid) openItemModal(c.dataset.uid);
});
document.querySelectorAll('[data-filter]').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel'); bagFilter=b.dataset.filter; renderBag();
  });
});
$('btnSortBag').addEventListener('click',()=>{
  S.bag.sort((a,b)=> b.rar-a.rar || b.ilvl-a.ilvl || a.kind.localeCompare(b.kind));
  renderBag(); sfx('buy'); saveGame();
});
$('btnAutoSalvage').addEventListener('click',()=>{
  let h = '<div class="pTitle" style="margin-bottom:4px;">Bulk Salvage</div>'+
    '<div class="pSub" style="margin-bottom:12px;">Melt everything in the backpack at or below a rarity. Equipped gear is never touched.</div>';
  for(let r=0;r<=3;r++){
    const n = S.bag.filter(i=>i.rar<=r).length;
    h += '<button class="btn wide rar'+r+'" data-act="bulkSalv" data-r="'+r+'" '+
      (n?'':'disabled')+' style="width:100%;margin-bottom:7px;border-color:'+RARITY[r].col+';color:'+RARITY[r].col+';">'+
      RARITY[r].name+' and below — '+n+' item'+(n===1?'':'s')+'</button>';
  }
  h += '<button class="btn gho" data-act="close" style="width:100%;margin-top:6px;">Cancel</button>';
  $('modalBody').innerHTML = h; $('modalWrap').classList.add('open');
});
function doBulkSalvage(r){
  const targets = S.bag.filter(i=>i.rar<=r);
  if(!targets.length) return;
  const tot={};
  for(const it of targets){
    const y = salvage(it);
    for(const k in y) tot[k]=(tot[k]||0)+y[k];
    S.bag.splice(S.bag.indexOf(it),1);
  }
  const parts = Object.keys(tot).map(k=> k==='gold'? tot.gold+'g' : tot[k]+'× '+MATS[k].n);
  toast('Salvaged '+targets.length+' → '+parts.join(', '));
  sfx('salv'); buzz(24);
  closeModal(); renderBag(); saveGame();
}
function markAlert(){ document.querySelector('[data-tab="pBag"]').classList.add('alert'); }

/* ================================================================
   CHARACTER PANEL
   ================================================================ */
let gearTab='equip', statStep=1;
function renderGear(){
  computeStats();
  $('gearSub').textContent = 'Level '+S.lvl+' · '+D.dps+' DPS · '+Math.round(D.maxHp)+' HP';
  document.querySelector('[data-tab="pGear"]').classList.toggle('alert', S.pts>0);

  /* slots */
  const g = $('slotGrid');
  g.innerHTML = SLOT_ORDER.map(k=>{
    const it = S.equip[k];
    const wide = (k==='weapon'||k==='offhand')?'':'';
    if(!it) return '<div class="slot empty '+wide+'" data-slot="'+k+'">'+
      '<div class="slotIc">'+SLOT_ICON[k]+'</div><div class="slotTxt">'+
      '<div class="slotLbl">'+SLOT_LABEL[k]+'</div><div class="slotName">empty</div></div></div>';
    return '<div class="slot filled rar'+it.rar+' '+wide+'" data-uid="'+it.uid+'">'+
      '<div class="slotIc">'+it.ic+'</div><div class="slotTxt">'+
      '<div class="slotLbl">'+SLOT_LABEL[k]+(it.plus?' +'+it.plus:'')+'</div>'+
      '<div class="slotName">'+it.name+'</div></div></div>';
  }).join('');

  /* stats */
  let h = '';
  if(S.pts>0) h += '<div id="ptsBanner">'+S.pts+' attribute point'+(S.pts===1?'':'s')+' to spend'+
    '<div style="display:flex;gap:6px;justify-content:center;margin-top:8px;">'+
      [['1','+1'],['5','+5'],['25','+25'],['0','ALL']].map(([v,l])=>
        '<button class="chip'+(statStep==+v?' sel':'')+'" data-step="'+v+'">'+l+'</button>').join('')+
    '</div></div>';
  h += '<div class="sectionLbl">Attributes</div>';
  for(const st of STATS){
    const gearBonus = D[st.k]-S.base[st.k];
    h += '<div class="coreStat">'+
      '<div class="sIc" style="color:'+st.col+'">'+st.ic+'</div>'+
      '<div class="sName"><b>'+st.n+'</b><span>'+st.d+'</span></div>'+
      '<div class="sVal" style="color:'+st.col+'">'+D[st.k]+
        (gearBonus>0?' <em>+'+gearBonus+'</em>':'')+'</div>'+
      '<button class="addBtn" data-stat="'+st.k+'" '+(S.pts>0?'':'disabled')+'>+</button>'+
    '</div>';
  }
  h += '<div class="sectionLbl">Offense</div><div class="statGrid">'+
    row('Damage', D.hitMin+' – '+D.hitMax)+
    row('DPS', D.dps, 1)+
    row('Attack Speed', (1/D.atkTime).toFixed(2)+'/s')+
    row('Crit Chance', D.critC.toFixed(1)+'%')+
    row('Crit Damage', Math.round(D.critD)+'%')+
    row('All Damage', '+'+Math.round(D.allDmg)+'%')+
    row('Life on Hit', Math.round(D.lifeHit))+
    row('Thorns', Math.round(D.thorns))+
  '</div>';
  h += '<div class="sectionLbl">Defense &amp; Utility</div><div class="statGrid">'+
    row('Max Health', Math.round(D.maxHp))+
    row('Armor', Math.round(D.armor))+
    row('Mitigation', Math.round(D.armor/(D.armor+46+13*zoneLvl())*100)+'%')+
    row('Health Regen', D.hpReg.toFixed(1)+'/s')+
    row('Max Mana', Math.round(D.maxMp))+
    row('Mana Regen', D.mpReg.toFixed(1)+'/s')+
    row('Move Speed', '+'+Math.round(D.movSpd)+'%')+
    row('Magic Find', '+'+Math.round(D.luck)+'%')+
    row('Gold Find', '+'+Math.round(D.goldF)+'%')+
    row('Block', D.block? Math.round(D.block*100)+'%':'—')+
  '</div>';

  const uk = Object.keys(D.uniq||{});
  if(uk.length){
    h += '<div class="sectionLbl">Relic Powers</div>';
    for(const k of uk){
      const u = D.uniq[k];
      h += '<div class="detBlock rar5" style="border-color:rgba(244,63,94,.4);margin-bottom:7px;">'+
        '<div style="font-size:11.5px;font-weight:800;color:var(--r5);letter-spacing:.6px;">◆ '+u.n+'</div>'+
        '<div style="font-size:11px;color:var(--dim);margin-top:4px;line-height:1.5;">'+u.d+'</div></div>';
    }
  }
  h += '<div class="sectionLbl">Record</div><div class="statGrid">'+
    row('Total Kills', fmt(S.meta.kills))+ row('Deaths', S.meta.deaths)+
    row('Items Found', fmt(S.meta.items))+ row('Salvaged', fmt(S.meta.salvaged))+
    row('Chests Opened', S.meta.chests)+ row('Best Drop', RARITY[S.meta.best].name)+
  '</div>';
  $('gearStats').innerHTML = h;

  $('gearEquip').style.display = gearTab==='equip'?'':'none';
  $('gearStats').style.display = gearTab==='stats'?'':'none';
}
function row(k,v,up){ return '<div class="statRow"><span class="k">'+k+'</span>'+
  '<span class="v'+(up?' up':'')+'">'+v+'</span></div>'; }

$('slotGrid').addEventListener('click', e=>{
  const s = e.target.closest('.slot'); if(!s) return;
  if(s.dataset.uid) openItemModal(s.dataset.uid);
  else { toast('Equip a '+SLOT_LABEL[s.dataset.slot]+' from your backpack'); }
});
$('gearStats').addEventListener('click', e=>{
  const st = e.target.closest('[data-step]');
  if(st){ statStep = +st.dataset.step; sfx('buy'); renderGear(); return; }
  const b = e.target.closest('[data-stat]'); if(!b || S.pts<=0) return;
  const n = statStep===0 ? S.pts : Math.min(statStep, S.pts);
  S.base[b.dataset.stat] += n; S.pts -= n;
  computeStats(); P.hp=Math.min(P.hp,D.maxHp);
  sfx('buy'); renderGear(); saveGame();
});
$('gearSeg').addEventListener('click', e=>{
  const b=e.target.closest('[data-gt]'); if(!b) return;
  gearTab=b.dataset.gt;
  $('gearSeg').querySelectorAll('button').forEach(x=>x.classList.toggle('sel',x===b));
  renderGear();
});

/* ================================================================
   FORGE PANEL
   ================================================================ */
let craftTab='upgrade';
function costRow(cost){
  return '<div class="costRow">'+Object.keys(cost).map(k=>{
    const have = k==='gold'? S.gold : (S.mats[k]||0);
    const ok = have>=cost[k];
    const label = k==='gold' ? fmt(cost[k])+'g' : MATS[k].ic+' '+cost[k]+' '+MATS[k].n;
    return '<span class="cost '+(ok?'ok':'no')+'">'+label+' <span style="opacity:.6">('+fmt(have)+')</span></span>';
  }).join('')+'</div>';
}
function renderCraft(){
  const totalMats = MAT_ORDER.reduce((a,k)=>a+(S.mats[k]||0),0);
  $('craftSub').textContent = fmt(S.gold)+' gold · '+fmt(totalMats)+' materials';
  let h='';
  if(craftTab==='upgrade'){
    h += '<div class="warn">Upgrading raises an item\'s damage or armor by 6% per rank, up to +10. Costs scale hard — pick your keepers.</div>';
    const eq = SLOT_ORDER.map(k=>S.equip[k]).filter(Boolean);
    if(!eq.length) h += '<div class="empty">Equip something first.</div>';
    h += '<div class="sectionLbl">Equipped</div>';
    for(const it of eq) h += upgradeCard(it);
    const best = S.bag.slice().sort((a,b)=>b.rar-a.rar||b.ilvl-a.ilvl).slice(0,6);
    if(best.length){
      h += '<div class="sectionLbl">Backpack (top 6)</div>';
      for(const it of best) h += upgradeCard(it);
    }
  }
  else if(craftTab==='unique'){
    h += '<div class="warn">Relics are crafted, never dropped. Each carries a power that changes how you fight. Catalysts come from zone bosses.</div>';
    for(const r of RELICS){
      const made = S.crafted.includes(r.id);
      const can = hasMats(r.cost);
      h += '<div class="recipe rar5'+(can||made?'':' locked')+'">'+
        '<div class="rHead"><div class="cIcon" style="width:36px;height:36px;font-size:19px;">'+r.ic+'</div>'+
        '<div style="flex:1;"><div class="rName">'+r.n+'</div>'+
        '<div class="cMeta">Relic · '+SLOT_LABEL[r.slot==='ring'?'ring1':r.slot]+' · iLvl '+r.ilvl+'</div></div>'+
        (made?'<span class="tagEq">CRAFTED</span>':'')+'</div>'+
        '<div class="rDesc"><b style="color:var(--r5)">◆ '+r.uniq.n+'</b> — '+r.uniq.d+'</div>'+
        '<div class="rDesc" style="color:var(--dim2)">'+Object.keys(r.affix).map(k=>
          affStr({k,v:r.affix[k]})).join(' · ')+'</div>'+
        costRow(r.cost)+
        '<button class="btn '+(can?'pri':'')+'" data-act="craft" data-rid="'+r.id+'" '+
          (can?'':'disabled')+' style="width:100%;margin-top:9px;">'+
          (made?'Forge Another':'Forge Relic')+'</button>'+
      '</div>';
    }
  }
  else {
    h += '<div class="sectionLbl">Salvage Essences</div><div class="matGrid">'+
      ['scrap','dust','core','sigil'].map(matCell).join('')+'</div>';
    h += '<div class="sectionLbl">Zone Materials</div><div class="matGrid">'+
      ['hide','heart','cinder','ember','frost','glacier','ichor','fungal','void','rift'].map(matCell).join('')+'</div>';
    h += '<div class="sectionLbl">Boss Catalysts</div><div class="matGrid">'+
      ['fang','magma','crown','bloom','eye'].map(matCell).join('')+'</div>';
  }
  $('craftBody').innerHTML = h;
}
function matCell(k){
  const q = S.mats[k]||0;
  return '<div class="mat'+(q?'':' zero')+'" style="--mc:'+MATS[k].col+'">'+
    '<div class="mIc">'+MATS[k].ic+'</div><div class="mQ">'+fmt(q)+'</div>'+
    '<div class="mN">'+MATS[k].n+'</div></div>';
}
function upgradeCard(it){
  if(it.plus>=10) return '<div class="card rar'+it.rar+'"><div class="cIcon">'+it.ic+'</div>'+
    '<div class="cMid"><div class="cName">'+it.name+' <span class="plus">+10</span></div>'+
    '<div class="cMeta">Maximum rank reached</div></div></div>';
  const cost = upgradeCost(it);
  const can = hasMats(cost);
  return '<div class="card rar'+it.rar+'" style="display:block;">'+
    '<div style="display:flex;gap:10px;align-items:center;">'+
      '<div class="cIcon">'+it.ic+'</div>'+
      '<div class="cMid"><div class="cName">'+it.name+(it.plus?' <span class="plus">+'+it.plus+'</span>':'')+'</div>'+
      '<div class="cMeta">'+itemSub(it)+'</div>'+
      '<div class="cStat">'+itemStatLine(it)+' → <b style="color:var(--xp)">'+
        (it.kind==='weapon'
          ? Math.round(it.dmin*(1+(it.plus+1)*0.06))+'–'+Math.round(it.dmax*(1+(it.plus+1)*0.06))
          : Math.round(it.armor*(1+(it.plus+1)*0.06)))+'</b></div></div>'+
    '</div>'+
    costRow(cost)+
    '<button class="btn '+(can?'pri':'')+' sm" data-act="upgrade" data-uid="'+it.uid+'" '+
      (can?'':'disabled')+' style="width:100%;margin-top:8px;">Upgrade to +'+(it.plus+1)+'</button>'+
  '</div>';
}
function doUpgrade(uid){
  const f = findItem(uid); if(!f) return;
  const it=f.it, cost=upgradeCost(it);
  if(!hasMats(cost)){ sfx('no'); return; }
  payMats(cost); it.plus++;
  computeStats();
  sfx('craft'); buzz(30);
  toast(it.name+' → +'+it.plus);
  closeModal(); renderCraft(); renderGear(); saveGame();
}
function doCraft(rid){
  const def = RELICS.find(r=>r.id===rid); if(!def) return;
  if(!hasMats(def.cost)){ sfx('no'); return; }
  if(!bagRoom(1)){ toast('Backpack full'); sfx('no'); return; }
  payMats(def.cost);
  const it = makeRelic(def);
  bagAdd(it);
  if(!S.crafted.includes(rid)) S.crafted.push(rid);
  sfx('craft'); sfx('loot',4); buzz([30,40,60]);
  renderCraft(); renderBag(); markAlert(); saveGame();
  showLoot([it],0,'Relic Forged');
}
$('craftBody').addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if(!b) return;
  if(b.dataset.act==='upgrade') doUpgrade(+b.dataset.uid);
  if(b.dataset.act==='craft')   doCraft(b.dataset.rid);
});
$('craftSeg').addEventListener('click', e=>{
  const b=e.target.closest('[data-ct]'); if(!b) return;
  craftTab=b.dataset.ct;
  $('craftSeg').querySelectorAll('button').forEach(x=>x.classList.toggle('sel',x===b));
  renderCraft();
});

/* ================================================================
   ZONES PANEL
   ================================================================ */
function renderZones(){
  $('zoneList').innerHTML = ZONES.map((z,i)=>{
    const cur = z.id===S.zone;
    const gap = z.lo - S.lvl;
    const danger = clamp((z.lo - S.lvl)/12 + 0.25 + (z.tier-1)*0.06, 0.05, 1);
    const dcol = danger>0.75?'#e0455a':danger>0.45?'#fb923c':'#4ade80';
    const k = S.zoneKills[z.id]||0;
    return '<div class="zoneCard'+(cur?' cur':'')+'">'+
      '<div class="zBg" style="background:linear-gradient(135deg,'+z.sky+','+z.sky2+')"></div>'+
      '<div class="zIn">'+
        '<div style="display:flex;align-items:baseline;gap:8px;">'+
          '<span class="zName" style="color:'+z.accent+'">'+z.n+'</span>'+
          '<span class="zTier" style="color:'+z.accent+'">Tier '+z.tier+'</span>'+
          (cur?'<span class="tagEq" style="margin-left:auto;">CURRENT</span>':'')+
        '</div>'+
        '<div class="zDesc">'+z.desc+'</div>'+
        '<div class="zStats">'+
          '<span>Level <b>'+z.lo+'–'+(z.hi>90?'∞':z.hi)+'</b></span>'+
          '<span>Enemies <b>'+(z.enemies.length+z.elites.length+1)+'</b></span>'+
          '<span>Cleared <b>'+fmt(k)+'</b></span>'+
          '<span>Boss <b style="color:'+z.accent+'">'+z.boss.n+'</b></span>'+
        '</div>'+
        '<div class="dangerRow"><span class="dLbl">Threat</span>'+
          '<div class="dangerTrack"><i style="width:'+Math.round(danger*100)+'%;background:'+dcol+'"></i></div>'+
          '<span class="dLbl" style="color:'+dcol+'">'+
            (gap>6?'LETHAL':gap>2?'RISKY':gap>-4?'FAIR':'TRIVIAL')+'</span>'+
        '</div>'+
        '<div class="zStats" style="margin-top:6px;">'+
          '<span>Drops '+MATS[z.mats[0]].ic+' '+MATS[z.mats[0]].n+' · '+
            MATS[z.mats[1]].ic+' '+MATS[z.mats[1]].n+' · '+MATS[z.cat].ic+' '+MATS[z.cat].n+'</span>'+
        '</div>'+
        '<div class="zBtnRow">'+
          '<button class="btn '+(cur?'':'pri')+' wide" data-zone="'+z.id+'" '+(cur?'disabled':'')+'>'+
            (cur?'You are here':'Travel')+'</button>'+
        '</div>'+
      '</div></div>';
  }).join('');
}
$('zoneList').addEventListener('click', e=>{
  const b = e.target.closest('[data-zone]'); if(!b||b.disabled) return;
  travelTo(b.dataset.zone);
});
function travelTo(id){
  S.zone = id;
  foes.length=0; shots.length=0; parts.length=0; drops.length=0; fx.length=0;
  corpses.length=0; chest=null; bossRef=null; kills=0; elitePity=0; bossPity=0; chestPity=0;
  $('bossBar').classList.remove('on'); $('prompt').style.display='none';
  computeStats();
  P.x=W/2; P.y=H*0.62; P.hp=D.maxHp; P.mp=D.maxMp; P.dead=false;
  buildBackdrop();
  toast('Entering '+ZONE_BY_ID[id].n);
  sfx('cast');
  renderZones(); saveGame();
  showTab('arena');
}

/* ================================================================
   CAMP PANEL
   ================================================================ */
function renderMenu(){
  let h = '<div class="sectionLbl">Supplies</div>';
  for(const s of SHOP){
    const cost = Object.assign({gold:s.gold}, s.mats);
    const can = hasMats(cost);
    h += '<div class="card rar1" style="display:block;">'+
      '<div style="display:flex;gap:10px;align-items:center;">'+
        '<div class="cIcon">'+s.ic+'</div>'+
        '<div class="cMid"><div class="cName" style="color:var(--txt)">'+s.n+'</div>'+
        '<div class="cMeta">'+s.d+'</div>'+
        '<div class="cStat">Held: <b>'+(S.pots[s.id]||0)+'</b></div></div>'+
        '<div class="cRight">'+(S.potSel===s.id?'<span class="tagEq">ACTIVE</span>':'')+'</div>'+
      '</div>'+ costRow(cost)+
      '<div style="display:flex;gap:6px;margin-top:8px;">'+
        '<button class="btn '+(can?'pri':'')+' sm" data-buy="'+s.id+'" '+(can?'':'disabled')+
          ' style="flex:1;">Buy</button>'+
        '<button class="btn sm" data-sel="'+s.id+'" style="flex:1;">Set Active</button>'+
      '</div></div>';
  }

  h += '<div class="sectionLbl">Options</div><div id="optRow">'+
    optBtn('sfx','🔊 Sound')+optBtn('haptic','📳 Haptics')+optBtn('autoAim','🎯 Auto-Attack')+'</div>'+
    '<div id="optRow" style="margin-top:7px;">'+
      ['high','med','low'].map(t=>'<button class="chip'+(S.opts.gfx===t?' sel':'')+
        '" data-gfx="'+t+'">🖼 '+({high:'Sharp',med:'Balanced',low:'Battery'})[t]+'</button>').join('')+
    '</div>'+
    '<div class="warn" style="margin-top:10px;">Auto-Attack fires the moment an enemy enters range. Turn it off to attack only while holding ⚔️.</div>';

  h += '<div class="sectionLbl">Controls</div>'+
    '<div class="detBlock"><div class="kv"><span>Move</span><b>Left thumb — drag anywhere</b></div>'+
    '<div class="kv"><span>Attack</span><b>⚔️ hold · auto-targets nearest</b></div>'+
    '<div class="kv"><span>Weapon Skill</span><b>✦ — scales with weapon class</b></div>'+
    '<div class="kv"><span>Dash</span><b>💨 — brief invulnerability</b></div>'+
    '<div class="kv"><span>Draught</span><b>🧪 — heal</b></div>'+
    '<div class="kv"><span>Desktop</span><b>WASD · Space · Q · E · R · F</b></div></div>';

  h += '<div class="sectionLbl">Save</div>'+
    '<div class="detBlock"><div class="kv"><span>Slot</span><b>'+SAVE_KEY+'</b></div>'+
    '<div class="kv"><span>Class</span><b>'+({melee:'Vanguard',range:'Warden',magic:'Riftbinder'}[S.cls])+'</b></div>'+
    '<div class="kv"><span>Progress saves automatically</span><b>✓</b></div></div>'+
    '<button class="btn dan" id="btnWipe" style="width:100%;margin-top:8px;">Delete Save &amp; Restart</button>'+
    '<div class="empty" style="padding-top:18px;">RIFTFALL · independent of RunePortal<br>'+
    'Kills '+fmt(S.meta.kills)+' · Items '+fmt(S.meta.items)+' · Deaths '+S.meta.deaths+'</div>';

  $('menuBody').innerHTML = h;
  $('btnWipe').addEventListener('click',()=>{
    $('modalBody').innerHTML='<div class="pTitle">Delete Save?</div>'+
      '<div class="pSub" style="margin:8px 0 14px;">This erases your character, gear and materials. It cannot be undone.</div>'+
      '<button class="btn dan" id="wipeYes" style="width:100%;margin-bottom:7px;">Yes, delete everything</button>'+
      '<button class="btn gho" data-act="close" style="width:100%;">Cancel</button>';
    $('modalWrap').classList.add('open');
    $('wipeYes').addEventListener('click', wipeSave);
  });
}
function optBtn(k,label){
  return '<button class="chip'+(S.opts[k]?' sel':'')+'" data-opt="'+k+'">'+label+
    ' · '+(S.opts[k]?'ON':'OFF')+'</button>';
}
$('menuBody').addEventListener('click', e=>{
  const q=e.target.closest('[data-gfx]');
  if(q){ S.opts.gfx=q.dataset.gfx; _downgrades=0; applyGfx(S.opts.gfx);
         sfx('buy'); renderMenu(); saveGame(); return; }
  const o=e.target.closest('[data-opt]');
  if(o){ S.opts[o.dataset.opt]=!S.opts[o.dataset.opt]; if(S.opts.sfx) audioInit();
         sfx('buy'); renderMenu(); saveGame(); return; }
  const b=e.target.closest('[data-buy]'); if(b){ doBuy(b.dataset.buy); return; }
  const s=e.target.closest('[data-sel]');
  if(s){ S.potSel=s.dataset.sel; sfx('buy'); renderMenu(); syncPotBtn(); saveGame(); }
});
function doBuy(id){
  const s = SHOP.find(x=>x.id===id); if(!s) return;
  const cost = Object.assign({gold:s.gold}, s.mats);
  if(!hasMats(cost)){ sfx('no'); return; }
  payMats(cost);
  S.pots[id]=(S.pots[id]||0)+1;
  if(!S.potSel || !S.pots[S.potSel]) S.potSel=id;
  sfx('buy'); toast('Bought '+s.n);
  renderMenu(); syncPotBtn(); saveGame();
}

/* ================================================================
   OVERLAYS
   ================================================================ */
function showLoot(items, gold, title){
  if(!items.length && !gold) return;
  $('lootTitle').textContent = title||'Chest Opened';
  $('lootCards').innerHTML =
    (gold? '<div class="lootCard rar4" style="--rc:var(--gold);padding:12px;">'+
      '<div class="lIc" style="font-size:30px;margin-bottom:2px;">💰</div>'+
      '<div class="lName" style="font-size:14px;">'+fmt(gold)+' gold</div></div>' : '')+
    items.map((it,i)=>'<div class="lootCard rar'+it.rar+'" style="animation-delay:'+(i*0.12)+'s">'+
      '<div class="lIc">'+it.ic+'</div>'+
      '<div class="lRar">'+RARITY[it.rar].name+'</div>'+
      '<div class="lName">'+it.name+'</div>'+
      '<div class="lStat">'+itemSub(it)+' · iLvl '+it.ilvl+'</div>'+
      '<div class="lStat">'+itemStatLine(it)+'</div>'+
      (it.uniq?'<div class="lAff" style="color:var(--r5)">◆ '+it.uniq.n+'</div>':'')+
      it.affixes.slice(0,3).map(a=>'<div class="lAff">'+affStr(a)+'</div>').join('')+
    '</div>').join('');
  $('lootWrap').classList.add('open');
  paused = true;
}
$('lootOk').addEventListener('click', ()=>{
  $('lootWrap').classList.remove('open');
  if(curTab==='arena' && !P.dead) paused=false;
});
function showLevelUp(n){
  $('lvlNum').textContent = S.lvl;
  $('lvlDesc').innerHTML = '+<b>'+(TUNE.ptsPerLvl*n)+'</b> attribute points<br>'+
    'Health and mana fully restored<br>'+
    '<span style="color:var(--dim2);font-size:11px;">Spend points in Hero → Stats</span>';
  $('lvlWrap').classList.add('open');
  paused = true;
  document.querySelector('[data-tab="pGear"]').classList.add('alert');
}
$('lvlOk').addEventListener('click', ()=>{
  $('lvlWrap').classList.remove('open');
  if(curTab==='arena' && !P.dead) paused=false;
  saveGame();
});
$('deathOk').addEventListener('click', ()=>{
  $('deathWrap').classList.remove('open');
  foes.length=0; shots.length=0; parts.length=0; drops.length=0; fx.length=0;
  corpses.length=0; chest=null; bossRef=null; kills=0; elitePity=0; bossPity=0; chestPity=Math.max(chestPity,20);
  $('bossBar').classList.remove('on'); $('prompt').style.display='none';
  computeStats();
  P.dead=false; P.hp=D.maxHp; P.mp=D.maxMp; P.x=W/2; P.y=H*0.62; P.inv=1.6;
  showTab('pMenu');
  saveGame();
});

/* ================================================================
   TABS
   ================================================================ */
let curTab='arena';
function showTab(t){
  curTab = t;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('sel', b.dataset.tab===t));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('open', p.id===t));
  closeModal();
  if(t==='arena'){
    paused = P.dead || $('lootWrap').classList.contains('open') || $('lvlWrap').classList.contains('open');
    resizeCanvas();
  } else {
    paused = true;
    if(t==='pBag'){ renderBag(); document.querySelector('[data-tab="pBag"]').classList.remove('alert'); }
    if(t==='pGear') renderGear();
    if(t==='pCraft') renderCraft();
    if(t==='pZone') renderZones();
    if(t==='pMenu') renderMenu();
    saveGame();
  }
}
document.querySelectorAll('.tab').forEach(b=>{
  b.addEventListener('click', ()=>{ audioInit(); showTab(b.dataset.tab); });
});
document.querySelectorAll('[data-close]').forEach(b=>{
  b.addEventListener('click', ()=>showTab('arena'));
});

/* ================================================================
   INTRO / BOOT
   ================================================================ */
const CLASSES = [
  {k:'melee',n:'Vanguard',  ic:'⚔️',col:'#f0955a',d:'Sword · high HP',
   long:'VANGUARD — Strength and Vitality. Starts with a sword and armour. Weapon skill is Whirlwind: three spinning cleaves that shred packs. Forgiving up close.'},
  {k:'range',n:'Warden',    ic:'🏹',col:'#6ee7a8',d:'Bow · crit speed',
   long:'WARDEN — Dexterity. Starts with a shortbow. Weapon skill is Volley: a ten-arrow fan. Highest crit and attack speed ceiling, thin health pool. Keep moving.'},
  {k:'magic',n:'Riftbinder',ic:'🔮',col:'#8ab4ff',d:'Staff · burst AoE',
   long:'RIFTBINDER — Intellect. Starts with a fire staff. Weapon skill is Arcane Nova: a huge point-blank ring. Enormous damage, spends mana, punished when swarmed.'},
];
let pickedClass=null;
function buildIntro(){
  $('classPick').innerHTML = CLASSES.map(c=>
    '<button class="classOpt" data-cls="'+c.k+'" style="--cc:'+c.col+'">'+
    '<span class="cIc2">'+c.ic+'</span><span class="cNm">'+c.n+'</span>'+
    '<span class="cDs">'+c.d+'</span></button>').join('');
  $('classPick').addEventListener('click', e=>{
    const b=e.target.closest('[data-cls]'); if(!b) return;
    audioInit();
    pickedClass = b.dataset.cls;
    $('classPick').querySelectorAll('.classOpt').forEach(x=>x.classList.toggle('sel',x===b));
    $('introDesc').textContent = CLASSES.find(c=>c.k===pickedClass).long;
    $('startBtn').disabled = false;
    sfx('buy');
  });
}
$('startBtn').addEventListener('click', ()=>{
  if(!pickedClass) return;
  audioInit();
  S = freshState(pickedClass);
  $('intro').classList.add('gone');
  boot();
  sfx('level');
});

function boot(){
  applyGfx(S.opts.gfx);
  makePlayer();
  if(S.hp && S.hp<=D.maxHp) P.hp=S.hp;
  if(S.mp && S.mp<=D.maxMp) P.mp=S.mp;
  buildBackdrop();
  syncPotBtn(); syncHud();
  renderBag(); renderGear(); renderCraft(); renderZones(); renderMenu();
  running = true; paused = false;
  showTab('arena');
  setInterval(()=>{ if(S) saveGame(); }, 15000);
  window.addEventListener('beforeunload', ()=>{ if(S) saveGame(); });
  document.addEventListener('visibilitychange', ()=>{
    if(document.hidden){ paused=true; saveGame(); }
    else if(curTab==='arena' && !P.dead) paused=false;
  });
}

/* boot or intro */
buildIntro();
if(loadGame()){
  $('intro').classList.add('gone');
  boot();
  toast('Welcome back — '+ZONE_BY_ID[S.zone].n);
} else {
  running = false;
}
requestAnimationFrame(loop);
</script>
</body>
</html>
